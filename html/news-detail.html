<!DOCTYPE html>
<meta charset="UTF-8">

<html lang="en">
<head>
<script src="lang.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<title>BA Solutions - News</title>
<style>
[hidden]{display:none!important}

.back-link {
  font-family: 'Michroma', 'Helvetica Neue', Helvetica, sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
::selection{background:#000;color:#f0ede8;}
:root{
  --u:calc(min(100vw, 1440px) / 1440);
  --bg:#ffffff;
  --bg2:#f2f2f2;
  --ink:#111;
  --ink2:#555;
  --ink3:#999;
  --line:#d4d0ca;
  --dark:#111;
  --dark2:#1a1a1a;
  --pad:max(20px, calc(60 * var(--u)))
}
body{background:var(--bg);color:var(--ink);font-family:'Helvetica Neue',Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;overflow-x:hidden;}

#article-header{padding:120px var(--pad) 48px;}
.back-link{display:inline-flex;align-items:center;gap:8px;font-size:max(8px, calc(12 * var(--u)));letter-spacing:.25em;color:var(--ink3);text-decoration:none;margin-bottom:36px;transition:color .3s;}
.back-link:hover{color:var(--ink);}
.art-tag{font-size:11px;letter-spacing:0;color:var(--ink3);display:block;margin-bottom:5px;}
.art-rule{width:100%;height:1px;background:var(--ink3);margin:0 0 10px;margin-left: -1px;}
#article-header h1{font-size:max(24px, calc(48 * var(--u)));font-weight:700;letter-spacing:-.01em;line-height:1.2;color:var(--ink);max-width:720px;margin-bottom:20px;}
.art-date{font-size:13px;color:var(--ink3);letter-spacing:0;}

#art-image{width:100%;aspect-ratio:16/7;background:var(--bg2);border-top:none;border-bottom:none;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}

#art-body{padding:60px var(--pad) 80px;border-bottom:0.5px solid var(--line);}
.art-grid{display:grid;grid-template-columns:max(200px, calc(280 * var(--u))) 1fr;gap:80px;align-items:start;}
.art-subtitle{font-size:15px;font-weight:600;line-height:1.5;color:var(--ink);letter-spacing:-.01em;}
.art-content{display:flex;flex-direction:column;gap:20px;}
.art-content p{font-size:15px;color:var(--ink);line-height:1.5;letter-spacing:0;text-indent: 0.5em;}
.art-content p strong{color:var(--ink);font-weight:600;}

@media (max-width:860px){
  .art-grid{grid-template-columns:1fr;gap:28px;}
  #art-body{padding-top:40px;}
}

#related{padding:max(20px, calc(40 * var(--u))) var(--pad) max(40px, calc(43.2 * var(--u)));}
#related h2{font-size:14px;letter-spacing:0;color:var(--ink3);margin-bottom:32px;font-weight:500;}
.related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);}
.related-item{background:var(--bg);padding:28px;text-decoration:none;color:inherit;transition:background .25s;display:block;}
.related-item:hover{background:var(--bg2);}
.ri-tag{font-size:11px;letter-spacing:0;color:var(--ink3);display:block;margin-bottom:10px;}
.ri-title{font-size:16px;font-weight:600;line-height:1.4;color:var(--ink);margin-bottom:8px;}
.ri-date{font-size:12px;color:var(--ink3);letter-spacing:0;}

@media (max-width:860px){
  #related{padding-bottom: 40px;}
  #related h2{margin-bottom: 20px;}
  .related-grid{grid-template-columns: 3fr;gap:1px;}
  .related-item{padding: 10px 24px 10px 24px;}
  .ri-tag{font-size:10px;margin-bottom:1px;}
  .ri-title{margin-bottom:1px;}
  .ri-date{font-size: 10px;}
}

.fade-in{opacity:0;transform:translateY(12px);transition:opacity .8s ease,transform .8s ease;}
.fade-in.visible{opacity:1;transform:translateY(0);}
</style>
<link rel="stylesheet" href="news.css?v=1">
</head>
<body>

<script src="nav.js"></script>

<style>
#ba-nav{background:#fff;border-bottom:none;}
#ba-nav .logo-wrap{color:#111;}
#ba-nav .logo-wrap svg{color:#111;fill:currentColor;stroke:currentColor;}
#ba-nav .nav-links a{color:rgba(0,0,0,.5);}
#ba-nav .nav-links a:hover{color:#111;}
#ba-nav .nav-about{border:none;background:transparent;color:rgba(0,0,0,.5);}
#ba-nav .nav-about:hover{background:transparent;color:#111;}

#ba-toggle{color:#111;}
#ba-menu{background:rgba(255,255,255,.45);}
#ba-menu .panel{background:#fff;}
#ba-menu a{color:rgba(0,0,0,.5);}
#ba-menu a:hover,#ba-menu a:focus-visible{color:#111;}

</style>

<div id="article-header">
  <a class="back-link" href="news.html">&#60; BACK TO NEWSROOM</a>
  <span class="art-tag"></span>
  <div class="art-rule"></div>
  <h1>Loading article…</h1>
  <span class="art-date"></span>
</div>

<div id="art-image">
  <img alt="" style="width:100%;height:100%;object-fit:cover;">
</div>

<div id="art-body" class="fade-in">
  <div class="art-grid">
    <div>
      <p class="art-subtitle"></p>
    </div>
    <div class="art-content"></div>
  </div>
</div>

<nav class="news-pagination" aria-label="Article navigation" hidden></nav>
<script src="footer.js"></script>

<script src="news-data.js"></script>
<script src="news-store.js"></script>
<script src="news-detail.js?v=4"></script>
</body>
</html>
