function keShot(th,t,main,faint,fade,opacity){
const r=th.resp,impact=trackAtU(th,th.endU),from=cuasHatch;
const at=v=>keShotAt(th,v);
const u=clamp((t-r.at)/r.flight);

const f=1-clamp((t-th.arrive-.5)/.7);
if(f>0)for(let v=0;v<u;v+=.058){const a=at(v),b=at(Math.min(u,v+.032));

if(u>=1)return;

const p=at(u),d=[impact[0]-from[0],impact[1]-from[1],impact[2]-from[2]+r.arc*4*(1-2*u)];

const yaw=Math.atan2(d[1],d[0]),climb=Math.atan2(d[2],Math.hypot(d[0],d[1]));
if(interceptor.place(p,yaw,climb-Math.PI/2,t,opacity))return;

const L=Math.hypot(d[0],d[1],d[2])||1,e=[d[0]/L,d[1]/L,d[2]/L];

const sL=Math.hypot(e[0],e[1])||1,side=[-e[1]/sL,e[0]/sL,0];

tail[0]-e[0]*.2+side[0]*.17*k,tail[1]-e[1]*.2+side[1]*.17*k,tail[2]-e[2]*.2);}

function netGun(th,t,main,net,opacity,pool){

const cut=box&&open<1?p[2]+box.min.z+(box.max.z-box.min.z)*open:Infinity;

const jamPeak=2.5;
const jamHash=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s);};
function rfJam(th,t,jam,jamFade,edge,edgeFade){
const r=th.resp,z0=ringZ+.01,brg=Math.atan2(th.aim[1],th.aim[0]),span=r.span*Math.PI/180,n=72,piece=8;
const len=Math.min(r.reach,(t-r.at)*r.speed),last=(t-r.at-(r.fronts-1)*r.gap)*r.speed;
const from=Math.max(0,last),ef=Math.min(1,(r.reach-last)/(r.reach*.25));
if(len>.2&&len>from&&ef>0)for(const s of [-1,1]){const c=Math.cos(brg+s*span),d=Math.sin(brg+s*span);
edge.push(c*from,d*from,z0,c*len,d*len,z0);edgeFade.push(ef,ef);}
const tick=Math.floor(t*24),flick=Math.floor(t*10);
for(let k=0;k<r.fronts;k++){
const rad=(t-r.at-k*r.gap)*r.speed;
if(rad<=.2||rad>=r.reach)continue;
const f=Math.min(1,(r.reach-rad)/(r.reach*.25)),peak=jamPeak*Math.min(1,rad/3);

for(let p=0;p<n/piece;p++){

for(let i=p*piece;i<(p+1)*piece;i++){jam.push(...pt(i),...pt(i+1));jamFade.push(f,f);}}}}

const host=(()=>{try{const f=window.frameElement;return f&&f.id==='cmdMap'?f:null;}catch(e){return null;}})();

function draw(th,t,it=Infinity){

if(baseDirty){baseDirty=false;buildBase(px);}

if(playing)for(const g of [deviceGroup,devicePlateGroup])fadeGroup(g,opening.device*opening.deviceGate);

for(const c of clipPlanes)c.normal.z=-1;

if(playing)for(const g of [deviceGroup,devicePlateGroup])fadeGroup(g,opening.device);
blurInto(rtMirrorObj.texture,rtMirrorObj,rtMirrorScratch,reflectionBlur*px*reflectionScale,blurWide);

if(!target.group.visible){
stackInto(rtMirrorGroundMasked.texture,rtMirrorObj.texture,rtLayer,groundReflectionOpacity,reflectionOpacity);

litLayer([targetPlateGroup],rtLitStatic,true,px,.4);
renderGroups([targetTextGroup],rtLayer);
cutTextInto(rtLitStatic.texture,rtLayer.texture,rtAccB);
if(pixelBlock>1)renderPixelated(pixelBlock);
litLayer([targetGroup],rtLitTarget,true,px);
threatBodyGroup.visible=true;pixQuad.visible=false;
stackInto(rtLitTarget.texture,rtAccB.texture,rtAccA);

const k=Math.min(8,Math.max(0,(targetYNow-bandLow(0))/band-.5)),targetSigma=Math.max(0,k-1)*targetDistanceBlur*px;
if(targetSigma<.05){copy.u.tSrc.value=rtAccA.texture;copy.run(rtTargetBlur);}
else blurInto(rtAccA.texture,rtTargetBlur,rtScratch,targetSigma);

stackInto(rtMirrorGroundMasked.texture,rtMirrorObj.texture,rtLayer,groundReflectionOpacity,reflectionOpacity);
stackInto(rtBaseBlur.texture,rtLayer.texture,rtScratch);
stackInto(rtTargetBlur.texture,rtScratch.texture,rtAccA);
present.u.tSrc.value=rtAccA.texture;present.run(null);}
requestAnimationFrame(frame);

if(host||framed){const models=[interceptor,spiderModel,...Object.values(threatModels).flat()];
const idle=window.requestIdleCallback?f=>requestIdleCallback(f,{timeout:1500}):f=>setTimeout(f,200);
const queue=threats.flatMap(th=>[.5,th.resp.at+.3,(th.resp.at+th.arrive)/2,th.arrive+.6].map(t=>[th,t]));
const warm=()=>{if(!root.isConnected||shown()||!queue.length)return;
if(!W||!H||!models.every(m=>m.ready)){setTimeout(()=>idle(warm),300);return;}
draw(...queue.shift());idle(warm);};
idle(warm);}
