<script type="module">
import * as THREE from 'three';
import {LineSegments2} from 'three/addons/lines/LineSegments2.js';
import {LineSegmentsGeometry} from 'three/addons/lines/LineSegmentsGeometry.js';
import {LineMaterial} from 'three/addons/lines/LineMaterial.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

// ---------------------------------------------------------------------------
// Stage 3 of the Three.js port: geometry, camera framing, motion, reflection,
// per-layer glow and distance blur, plus every label - nameplates, bearing
// letters, telemetry, altimeter - and the entrance sequence that reveals them.
// Labels are world-space textured quads, so the GPU gives them true perspective.
// World is Blender Z-up; every coordinate below matches aegis-motion-preview.html.
// ---------------------------------------------------------------------------
THREE.ColorManagement.enabled=false;
const root=document.getElementById('aegis-three-preview'),canvas=root.querySelector('canvas');

// Hologram layer heights above the glass (layerHeight scales them together).
const glassZ=0,layerHeight=.8,dotZ=.119*layerHeight,boxZ=.7065*layerHeight,ringZ=(dotZ+boxZ)/2,cubeZ=boxZ+.378767;
const deviceHalf=1.25,targetHalf=.75;
// Ground lattice: grid every 6, dots every 1, offset so the C-UAS is off the crossing.
const latticeOffset={x:2.3,y:3.8},gridStep=6,dotStep=1,xSpan=39;
const bandLow=k=>-5.57+k*8.67,yMin=bandLow(0),yMax=bandLow(9);
// --- grid coordinates: rows are letters, columns numbers, as in a spreadsheet ----
// Anchored to world cells, not to what happens to be on screen, so a cell keeps its
// name in every aspect: landscape shows columns 5-13, portrait the same rows from 7.
// Lettering hangs off the C-UAS's own row, which reads R, and runs toward the viewer:
// G at the back, R at the front. Numbers start at 5 and run toward +x. Neither starts
// at A or 1, so the lattice reads as part of a larger grid running off frame.
const cellX=(()=>{const v=[];for(let x=Math.ceil((-xSpan-latticeOffset.x)/gridStep)*gridStep+latticeOffset.x;x<=xSpan;x+=gridStep)v.push(x);return v;})();
const cellY=(()=>{const v=[];for(let y=Math.ceil((yMin-latticeOffset.y)/gridStep)*gridStep+latticeOffset.y;y<yMax;y+=gridStep)v.push(y);return v;})();
const cuasRow=Math.floor((0-cellY[0])/gridStep);
const cellName=(i,j)=>String.fromCharCode(82-(j-cuasRow))+(5+i);
const cellAt=(x,y)=>{const i=Math.floor((x-cellX[0])/gridStep),j=Math.floor((y-cellY[0])/gridStep);
return i<0||j<0||i>cellX.length-2||j>cellY.length-2?null:{i,j,name:cellName(i,j)};};
// A cell split 6x6, so a point can be named the way it is read off the map: rows
// counted from the cell's far edge, columns from its -x edge, both starting at 1.
// cellPoint('Q11') is the cell centre; cellPoint('Q11',2,3) is the sub-cell the
// paths below are written in.
const subDiv=6;
function cellPoint(name,row=(subDiv+1)/2,col=(subDiv+1)/2){
const j=cuasRow-(name.charCodeAt(0)-82),i=+name.slice(1)-5;
return [cellX[i]+(col-.5)*gridStep/subDiv,cellY[j+1]-(row-.5)*gridStep/subDiv];}
const groundFade=y=>Math.exp(-Math.pow(Math.max(0,(y+4)/29),1.8));
// A point is a much smaller light source than a grid line. Applying the same
// falloff made its energy disappear before the bearing ring at the same distance.
const dotFade=y=>Math.exp(-Math.pow(Math.max(0,(y+4)/42),1.45));
// Straight from the 2D pass, which authored them with the rings reflecting.
const reflectionOpacity=.38,groundReflectionOpacity=.62;
// Blur radii are authored for a 736 px wide 1x frame, so they scale with F and density.
// The restored lines made the glass read too bright at these opacities. Dimming the
// mirrors fixed that but flattened them away from the 2D original, so the strength
// stays and the radii take the correction instead: a mirrored line's peak falls as
// 1/sigma, so 1.48x radius buys back the third that .26/.42 did, and spreading it is
// what a reflection in glass does anyway. 2.5 -> 3.7 and 8 -> 12, the same ratio on
// both so the balance between the two mirrors is untouched.
const reflectionBlur=12,groundReflectionBlur=3.7,groundReflectionLineBoost=2.2,groundReflectionDotBoost=2;
// Keep the moving target's original depth cue, but make the static ground field
// clearer so dots, grid and bearings do not read as a soft background layer.
const groundDistanceBlur=.18,targetDistanceBlur=.26,band=8.67;
// The mirrored dots sit closest to the glass: the 2D pass keeps them at full
// resolution with a blur of 1 plus the band blur, and only the rings and bearings
// take the wider radius. Blurring both together smears each mirrored dot into the
// real dot above it and the lattice turns to mush. The dots are also the one part
// of the mirror the restored lines did not brighten, so they keep the 2D radius.
const dotReflectionBlur=1;
let reflectionScale=.5;
// Glow is rebuilt the way the 2D pass drew it: blur each layer and add it back with
// that layer's own shadowBlur radius. One global bloom cannot do this - it either
// smears the lattice or leaves the objects flat.
// canvas shadowBlur b spreads like a gaussian of sigma b/2; glowPx(v)=v*glowSize*F/736*scale.
const glowSize=1.275,glowSigma=v=>v*glowSize/2;
// Objects paint twice (wide 12, tight 5); the lattice used 3 on lines and 2 on dots.
const glowObjectWide=glowSigma(12),glowObjectTight=glowSigma(5),glowGround=glowSigma(2.5);
const glowDotWide=glowSigma(7),glowDotTight=glowSigma(3.25);

// Target paths. Each threat flies its own track, written in grid cells so a path can
// be read straight off the lattice: the cell it enters from, the cell it is aimed at,
// and the cell where the response reaches it. The fixed wing crosses the field and is
// shot down short of the C-UAS, the rotary comes at the C-UAS and is netted just short
// of it, and the swarm keeps Blender's original approach.
const targetStart=[2.715909,23.160755,7.576042],targetEndXY=[0,2];
// Readout scale: one world unit reads as this many metres.
const worldMetres=15;
// Blender's elliptical cylinder, drawn only until a threat's airframe has loaded. Its
// per-threat scale still sizes the brackets and how far a wreck falls, and is kept
// close to the airframe each threat now flies.
const bodyDims={rx:.417581,ry:.510412,hz:.206487},maxCraft=4;
// The swarm's three hold their slots exactly; only the descent differs. lift is each
// drone's own height in the formation, sag how much further it dips mid-run, so the
// three settle on slightly different curves without ever drifting sideways.
// The slots are a shallow V across the track rather than along it. Depth collapses on
// screen at this camera pitch - a unit along the track moves a drone less than half as
// far across frame as a unit across it - so a formation spread down the track reads as
// two drones with a third hidden behind them. Spread across, all three stay apart in
// landscape and portrait alike.
const swarmSlots=[[-1.25,.24],[0,-.3],[1.25,.24]];
const swarmLift=[.3,-.16,-.1],swarmSag=[-.14,.1,.05];
// craft: bodies in the formation. approach: seconds from the hold to being stopped.
// start/aim: the two ends of the straight line the track is built on. stop: the cell
// the response reaches it in, which is where the track ends. rise(u): how the descent
// spreads over the whole line, so a threat cut short flies only its own part of it.
// offset(i,u,t): a craft's [side, along, up] displacement from the track centre.
// lean: a multirotor's nose-down tilt at cruise, in radians, in place of pitching to
// the climb as a fixed wing does; it rights itself as the craft slows to a stop.
// asset: the ground objective it is flying at - ext units past aim on its own line, its
// ASSET plate on the dir side of the reticle (see updateAsset).
// hold: seconds before a track starts moving. Nothing waits: a threat is already
// under way while it resolves in (see pixelBlocks).
const pointAlong=(a,b,f)=>[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];
const hold=0,threats=[
// Fast, heading for R12 - across the field rather than at the C-UAS - on a bow of about
// 3% of its length toward +x. Its asset is on the ground on that same heading, .8 of the
// way to R12: at R12 itself it fell off the right edge at the AEGIS page's 50vw x 100vh
// and in portrait. It glides down onto it at a steady slope (about 19 degrees) instead
// of holding height and dropping at the end. The interceptor takes it at Q11-2:3.
{id:'FIXED_WING',craft:1,approach:5,model:'uav',
start:cellPoint('O9'),aim:pointAlong(cellPoint('O9'),cellPoint('R12'),.8),stop:cellPoint('Q11',2,3),
startZ:7.576042,endZ:boxZ,scale:[1.5,.6,.72],jitter:.1,
asset:{ext:0,dir:-1},
// Hit, it breaks up: shards scatter off the impact while the airframe goes down
// nose-first and dissolves, and the readouts stay where it was hit (pin).
resp:{tag:'KE-SHOT',flight:1.8,arc:3.2,fall:1.3,pin:true,hold:2,
debris:{count:16,life:1.4,speed:[1,2.6],kick:.9,carry:.8,gravity:5,size:[.05,.14]}},
rise:u=>u,offset:()=>[0,0,0]},
// Slow and low, straight in at the C-UAS. The net takes it the moment it crosses out
// of Q11 into Q10 - Q10-3:6 is the first sub-cell past that edge and lies exactly on
// this line - so that point is simply where the track ends. The swarm is stopped on
// the same row, one unit further in. The only motion off the line is the small
// vertical bob a rotor keeps as it flies.
{id:'ROTARY',craft:1,approach:6.5,
start:cellPoint('P11',5,4),aim:cellPoint('Q10',3,6),
model:'rotary',lean:.26,
startZ:4.4,endZ:1.8,scale:[1,1,1],jitter:.1,
asset:{ext:6,dir:-1},
// The Spider comes up at the inner end of Q9 rather than its centre. The cell was
// given as the launch point, but the centre (-6.7, 6.8) is a near point well left
// of the frame: holding it costs 10% of the composition in portrait and 14% at
// 414x900, and leaving it out has the Spider half cut off at the left edge. The
// sub-cell Q9-3:6 is the furthest +x point of the same cell, and it is inside the
// existing frame at every aspect measured (no change to framePoints).
// It is a drone itself, so it does not throw from there: it unfolds, flies in and
// takes station standoff short of the capture point, between the rotary and the
// C-UAS it is covering. 1.5 units is about 23 m, which is the range a net gun
// actually works at; from Q9 it would have been ninety. half is its own indicator
// box, smaller than a track's both because it is a small airframe and because the
// two boxes have to stand side by side without touching.
resp:{tag:'NET-GUN',from:cellPoint('Q9',3,6),fromZ:2.7,standoff:1.5,rise:.35,half:.34,
lead:5.4,open:.4,tagDelay:.15,tagRate:2.4,settle:.45,net:.3,wrap:.26,cinch:.35,fall:1,hold:2.2,pin:true},
rise:u=>u*u,offset:(i,u,t)=>[0,0,Math.sin(t*1.8)*.12]},
// Three flying a held formation on Blender's original approach. The slots do not
// drift, so the three read as one object; half is the box that goes around all of
// them, since a swarm is one engagement and gets one set of readouts.
// Blender's corridor still, but jammed as it reaches Q10 rather than carried all the
// way in to the device: Q10-3:5 is on the same row as the rotary's capture, one unit
// further in, and sits within .12 of the original line, so the approach is the same
// one turned .4 degrees.
// pin (all three threats): the readouts stay where the threat was put down -
// brackets, plate and box hold that spot - and only the airframes go down,
// dissolving as they fall.
{id:'UAS_SWARM',label:'UAS_SWARM x3',craft:3,approach:7,half:1.9,model:'swarm',lean:.26,
start:[targetStart[0],targetStart[1]],aim:cellPoint('Q10',3,5),
startZ:targetStart[2],endZ:3.6,scale:[.62,.62,.62],jitter:.3,
asset:{ext:10,dir:-1},
resp:{tag:'RF-JAM',fronts:3,gap:.3,speed:11,reach:14,span:18,fall:1.2,hold:2.4,pin:true},
rise:u=>u*u,offset:(i,u)=>{const slot=swarmSlots[i];
return [slot[0],slot[1],swarmLift[i]+swarmSag[i]*4*u*(1-u)];}}];
// Each track is solved once. axis is the straight line from start to aim; endU is how
// far along it the threat gets; bow, for a threat whose path is cut short off the
// line, is sized so the curve passes exactly through the stop cell. Move a cell and
// the curve moves with it; nothing here is a hand-fitted constant.
for(const th of threats){
const dx=th.aim[0]-th.start[0],dy=th.aim[1]-th.start[1],L=Math.hypot(dx,dy);
th.axis={along:[dx/L,dy/L],side:[-dy/L,dx/L],length:L};
// The asset is what the threat is flying at: on the ground, ext units on along its own
// line past the aim cell, so it lies wherever that threat happens to be heading.
const e=th.asset;e.at=[th.start[0]+dx/L*(L+e.ext),th.start[1]+dy/L*(L+e.ext)];
if(th.stop){const kx=th.stop[0]-th.start[0],ky=th.stop[1]-th.start[1];
const u=th.endU=(kx*th.axis.along[0]+ky*th.axis.along[1])/L;
th.bow=(kx*th.axis.side[0]+ky*th.axis.side[1])/(4*u*(1-u));}
else th.endU=1;
if(th.half===undefined)th.half=targetHalf;
th.move=th.approach;th.hz=bodyDims.hz*th.scale[2];
// arrive is where the track ends, which is the cell the response stops the threat
// in. The old two-second dwell after arrival is now the response itself: each one
// declares how long it needs (hold) before the engagement fades.
th.arrive=hold+th.approach;
// A response that has to be in the air first starts early: the interceptor by its
// flight time, the Spider by its lead. The jammer only answers once the swarm is in.
const r=th.resp;r.at=th.arrive+(r.delay||0)-(r.flight||0)-(r.lead||0);
// Every response connects the moment the track ends, so nothing is ever caught
// standing still: the interceptor, the net and the jamming front are all timed to
// arrive there. close is how long the entrance takes to play backwards afterwards.
th.kill=th.arrive;th.close=1;
// The suppression bracket goes a little outside the body it marks.
th.markHalf=Math.max(bodyDims.rx*th.scale[0],bodyDims.ry*th.scale[1])*1.6+.09;
th.fadeAt=th.arrive+r.hold;th.loop=th.fadeAt+2;}
// u runs 0 -> endU over the moving part and then holds there.
const threatU=(th,t)=>Math.min(1,Math.max(0,(t-hold)/th.move))*th.endU;
// The track centre: what the location box, vertical guide and readouts follow.
function trackAtU(th,u){const a=th.axis,d=a.length*u,w=th.bow?th.bow*4*u*(1-u):0;
return [th.start[0]+a.along[0]*d+a.side[0]*w,th.start[1]+a.along[1]*d+a.side[1]*w,
th.startZ-(th.startZ-th.endZ)*th.rise(u)];}
const trackAt=(th,t)=>trackAtU(th,threatU(th,t));
// The front leaves early enough to reach the formation exactly as the track ends.
// Solved from the range of the stop point, so moving the stop moves the emission.
// The Spider's station is solved the same way: standoff short of the capture point
// along its own run in, so moving either cell moves the station with them. It
// unfolds where it comes up, flies for whatever is left, and is settled before it
// throws.
for(const th of threats){const r=th.resp;
if(r.fronts){const p=trackAtU(th,th.endU);r.at=th.arrive-Math.hypot(p[0],p[1])/r.speed;}
if(r.from){const k=trackAtU(th,th.endU);
const dx=k[0]-r.from[0],dy=k[1]-r.from[1],L=Math.hypot(dx,dy)||1;
r.station=[k[0]-dx/L*r.standoff,k[1]-dy/L*r.standoff,k[2]+r.rise];
// It is already flying while it prints in; its readout starts a little after.
r.flyFrom=r.at;r.tagFrom=r.at+r.tagDelay;r.flyTo=th.arrive-r.net-r.settle;}}
function craftAt(th,i,t){const c=trackAt(th,t),a=th.axis,[s,al,up]=th.offset(i,threatU(th,t),t);
return [c[0]+a.side[0]*s+a.along[0]*al,c[1]+a.side[1]*s+a.along[1]*al,c[2]+up];}
// Sequential acquisition, unchanged from the 2D pass: target -> X line -> XY box ->
// vertical -> nameplate and altitude together. entranceRate 1.5 compresses every
// start time and duration by 1/1.5, while the decode and the count-ups keep their
// own length and only their start follows the sequence.
// --- what the response does to the threat -----------------------------------
// A kill is expressed as position, nothing more. Everything downstream - location
// box, vertical guide, altimeter, altitude readout, the measured speed - reads the
// centre through centreAt. With resp.pin (every threat now) that centre stays where
// the kill was and only the airframes fall; wreckAt is the falling centre, for what
// has to ride the wreck down (the net).
const fallEase=p=>p*p;
// When a craft starts falling: the moment it is hit or netted, or for each drone of
// the swarm, as the first jamming front reaches it.
function fallStart(th,i){const r=th.resp;
if(!r.fronts)return th.arrive;
const p=craftAt(th,i,th.arrive);return r.at+Math.hypot(p[0],p[1])/r.speed;}
function craftDrop(th,i,t){const r=th.resp;
if(r.fall===undefined)return 0;
const p=clamp((t-fallStart(th,i))/r.fall);
// Down to where the body touches the glass, so it lands on its own reflection.
return p<=0?0:Math.max(0,craftAt(th,i,th.arrive)[2]-(th.hz+.02))*fallEase(p);}
const centreDrop=(th,t)=>{let s=0;for(let i=0;i<th.craft;i++)s+=craftDrop(th,i,t);return s/th.craft;};
// A pinned response leaves the centre, and so every readout, where the kill was.
const wreckAt=(th,t)=>{const c=trackAt(th,t);return [c[0],c[1],c[2]-centreDrop(th,t)];};
const centreAt=(th,t)=>th.resp.pin?trackAt(th,t):wreckAt(th,t);
const craftPos=(th,i,t)=>{const p=craftAt(th,i,t);return [p[0],p[1],p[2]-craftDrop(th,i,t)];};
// Where a craft's brackets go: on the wreck, or held where it was when the kill
// landed if pinned (the rotary's bob would otherwise keep them moving).
const markPos=(th,i,t)=>th.resp.pin?craftAt(th,i,Math.min(t,th.kill)):craftPos(th,i,t);
// A falling craft dissolves over its own fall, gone as it reaches the glass.
function bodyFade(th,i,t){const r=th.resp;
return r.fall===undefined?1:1-clamp((t-fallStart(th,i))/r.fall);}
// Nothing holds a netted rotor level any more.
function tumble(th,t){const r=th.resp;
if(r.net===undefined)return null;
const p=t-th.arrive;return p>0?[p*3.7,p*2.3,p*5.1]:null;}

const entranceRate=1.5,entrance={boxX:.55,boxY:.95,vertical:1.5,labels:2.25,decode:2.4,altitude:2.25,craft:0};
// Where the sequence has finished, in et units - the point it is rewound from.
const entranceSpan=2.8;
const clamp=v=>Math.max(0,Math.min(1,v));
const phase=(t,at,duration)=>clamp((t-at)/duration);
const ease=p=>p*p*(3-2*p);
// Opening timings, in seconds from its start (the sequence is described at applyIntro).
// The preview's tuning panel edits this object live.
const intro={dotAt:0,dotDur:.7,dotSweep:.6,dotRise:1.2,
deviceAt:.6,deviceDur:.7,deviceRise:1.5,
// The C-UAS indicator opens like the track's: X line, then the box in Y straight
// after, then the plate slides in and its name decodes.
boxAt:1,boxX:.2,boxY:.3,plateAt:1.45,plateDur:.3,decodeDur:.47,
ringAt:1,ringDur:.8,ringFrom:.1,
turnAt:2,turnDur:1,threatAt:2.6};
const introEnd=()=>Math.max(intro.dotAt+intro.dotSweep+intro.dotDur,intro.deviceAt+intro.deviceDur,
intro.boxAt+intro.boxX+intro.boxY,intro.plateAt+Math.max(intro.plateDur,intro.decodeDur),
intro.ringAt+intro.ringDur,intro.turnAt+intro.turnDur);
const headingFrom=0,headingTo=320;
// What buildBase and the object mirror read: C-UAS strength, and its mirror held back
// while it is still under the glass.
const opening={device:1,deviceGate:1};
// Homepage indicator timing: .45s cubic-bezier(.2,.7,.2,1).
function indicatorEase(p){if(p<=0)return 0;if(p>=1)return 1;
let lo=0,hi=1;for(let i=0;i<16;i++){const u=(lo+hi)/2,x=3*(1-u)*(1-u)*u*.2+3*(1-u)*u*u*.2+u*u*u;if(x<p)lo=u;else hi=u;}
const u=(lo+hi)/2;return 3*(1-u)*(1-u)*u*.7+3*(1-u)*u*u+u*u*u;}
function decodedName(text,progress,t){
const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',settled=Math.floor(progress*text.length),tick=Math.floor(t*24);
return Array.from(text,(ch,i)=>i<settled?ch:alphabet[(tick*7+i*11)%alphabet.length]).join('');}
// Fixed-width strings, so typing and counting never shift a row once it is typed.
const telemetryRows=m=>{const pad=v=>v.toFixed(1).padStart(5,'0'),clock=v=>isFinite(v)?String(Math.floor(v/60)).padStart(2,'0')+':'+String(Math.floor(v%60)).padStart(2,'0'):'--:--';
return [[pad(m.speed),'km/h'],[pad(m.distance),'m'],[clock(m.eta),''],[m.cell.padEnd(3),' GRID']];};
const telemetryChars=telemetryRows({speed:0,distance:0,eta:0,cell:'R10'}).flat().join('').length,typingRate=45;
// Flat nameplate right of a location square, sharing its lower edge and plane.
// dir puts the plate on the other side of the box, which is the only way two
// indicators can stand this close without their plates landing on each other.
const nameplate=(x,y,half,dir=1)=>({z:boxZ,w:2.4,h:.75,x:x+dir*(half+.25+1.2),y:y-half+.375});

let W=736,H=414,F=736,focal=1022,shiftX=0,shiftY=0;

for(let j=cellY.length-2;j>=0;j--){const alpha=.62*groundFade(cellY[j+1]);
// Fainter than this and the glow swallows the tag whole.
if(alpha<.02)continue;
for(let i=0;i<cellX.length-1;i++){const q=cellQuad(cellName(i,j),color);
placeTexture(p,q.tex,cellLabelAt(i,j,q),q.ax,q.ay,alpha);}}
endText(p);}

// --- rings and bearing ticks -------------------------------------------------
function buildRings(){
const ringSeg=(r,alpha,width,minWidth=1.2)=>{const pos=[],col=[],n=192;
for(let i=0;i<n;i++){const a0=i/n*Math.PI*2,a1=(i+1)/n*Math.PI*2;
pos.push(Math.cos(a0)*r,Math.sin(a0)*r,ringZ,Math.cos(a1)*r,Math.sin(a1)*r,ringZ);
col.push(groundColor.r,groundColor.g,groundColor.b,groundColor.r,groundColor.g,groundColor.b);}
ringGroup.add(lineSegs(pos,col,lineMat(groundColor,alpha,width,minWidth)));};
// The inner two rings and the heading line that crosses them all sat on the 1.2 floor,
// which is the same weight as the ring carrying the bearing ticks. At .9 they read as
// the lightest ring on the ground bar the two faint outer ones, which are .82 and .68:
// going under .82 would put the inner rings below the outer ones and invert the order.
const thinWidth=.9;
for(const [r,alpha,width,minWidth] of [
  [3.8,.49,.8,thinWidth],[7,.49,.8,thinWidth],[11.5,.49,1.35,1.2],
  [17,.25,.82,.82],[24,.15,.68,.68]
])ringSeg(r,alpha,width,minWidth);
// Bearing ticks on the fourth ring; the C-UAS faces +Y at bearing 320, clockwise toward +X.
const r=11.5,facing=320,wide=[],narrow=[],wideCol=[],narrowCol=[];
for(let deg=0;deg<360;deg+=15){
const a=(deg-facing)*Math.PI/180,s=Math.sin(a),c=Math.cos(a),named=deg%45===0;
const tick=deg%90===0?.5:named?.38:.25;
(named?wide:narrow).push(s*(r-tick),c*(r-tick),ringZ,s*r,c*r,ringZ);
(named?wideCol:narrowCol).push(groundColor.r,groundColor.g,groundColor.b,groundColor.r,groundColor.g,groundColor.b);}
for(const [pos,col,width] of [[wide,wideCol,1],[narrow,narrowCol,.8]])dialGroup.add(lineSegs(pos,col,lineMat(groundColor,.7,width)));
// Heading line from the C-UAS box front edge (+Y) out to the bearing ring, and the
// current-bearing readout beside its top, just inside the ring and clear of the ticks.
ringGroup.add(polyline([[0,deviceHalf,ringZ],[0,r,ringZ]],groundColor,.75,.8,thinWidth));
const bx0=.2,bx1=1.1,by1=r-.65,by0=by1-.4;
ringGroup.add(quadFace([[bx0,by0,ringZ],[bx1,by0,ringZ],[bx1,by1,ringZ],[bx0,by1,ringZ]],groundColor,.8,.7,.06));}

// Bearing labels. Every one faces the ring centre and shares one baseline radius, so
// their bottoms line up; north reads largest, then the other named points, then the
// degree numbers. Rebuilt when the webfont arrives.
function buildCompassText(){
const r=11.5,base=r+.3,facing=320,names={0:'N',45:'NE',90:'E',135:'SE',180:'S',225:'SW',270:'W',315:'NW'};
const p=beginText(dialGroup),color=hex(groundColor);
for(let deg=0;deg<360;deg+=15){
const a=(deg-facing)*Math.PI/180,s=Math.sin(a),c=Math.cos(a),name=names[deg],north=deg===0,angle=-a;
const w=north?4.2:name?2.4:2.1,h=north?2.8:name?1.6:1.1;
placeText(p,name||deg+'\u00b0',[s*base,c*base,ringZ+.002],
[Math.cos(angle)*w/2,Math.sin(angle)*w/2,0],[-Math.sin(angle)*h/2,Math.cos(angle)*h/2,0],
color,name?.95:.85,name?700:500,68/192,'center','alphabetic',true);}
endText(p);drawHeading(headingShown);}
// Current-bearing readout beside the top of the heading line. It counts during the
// opening while the dial turns under it, so it is a pool of its own.
let headingShown=320;
function drawHeading(deg){headingShown=deg;
const p=beginText(headingGroup);
placeText(p,deg+'\u00b0',[.65,11.5-.85,ringZ+.002],[1.2,0,0],[0,.625,0],hex(groundColor),.95,300,68/192,'center','middle',true);
endText(p);}

// --- objects: location boxes, C-UAS cube, target body ------------------------
function boxOutline(half,z,color,alpha,width,fill){
const g=new THREE.Group();
const p=[[-half,-half,z],[half,-half,z],[half,half,z],[-half,half,z]],pos=[],col=[];
for(let i=0;i<4;i++){const a=p[i],b=p[(i+1)%4];pos.push(...a,...b);col.push(color.r,color.g,color.b,color.r,color.g,color.b);}
g.add(lineSegs(pos,col,lineMat(color,alpha,width)));
if(fill){const m=new THREE.Mesh(new THREE.PlaneGeometry(half*2,half*2),
new THREE.MeshBasicMaterial({color,transparent:true,opacity:fill,side:THREE.DoubleSide,depthWrite:false}));
m.position.z=z;g.add(m);}
return g;}

// One face of the cube: a closed outline plus its fill, exactly as line(...,closed,fill) drew it.
function quadFace(pts,color,alpha,width,fill){
const g=new THREE.Group(),pos=[],col=[];
for(let i=0;i<4;i++){const a=pts[i],b=pts[(i+1)%4];pos.push(...a,...b);col.push(color.r,color.g,color.b,color.r,color.g,color.b);}
g.add(lineSegs(pos,col,lineMat(color,alpha,width)));
if(fill){const geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.Float32BufferAttribute([...pts[0],...pts[1],...pts[2],...pts[0],...pts[2],...pts[3]],3));
g.add(new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color,transparent:true,opacity:fill,side:THREE.DoubleSide,depthWrite:false})));}
return g;}
function polyline(pts,color,alpha,width,minWidth){const pos=[],col=[];
for(let i=0;i<pts.length-1;i++){pos.push(...pts[i],...pts[i+1]);col.push(color.r,color.g,color.b,color.r,color.g,color.b);}
return lineSegs(pos,col,lineMat(color,alpha,width,minWidth));}

function buildDevice(){
const g=new THREE.Group();
// Cube keeps its Blender size; its base sits on the C-UAS location box.
// Only the three faces the camera can see are drawn. Hidden edges and the ground
// behind the translucent faces otherwise read as a lattice inside the box.
const x=.589902,y=.779906,z=cubeZ,h=.378767;
const coverage=new THREE.Mesh(new THREE.BoxGeometry(x*2,y*2,h*2),
new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide,depthTest:false,depthWrite:false}));
coverage.position.z=z;deviceMaskGroup.add(coverage);
const v=[[-x,-y,z-h],[x,-y,z-h],[x,y,z-h],[-x,y,z-h],[-x,-y,z+h],[x,-y,z+h],[x,y,z+h],[-x,y,z+h]];
for(const f of [[0,1,5,4],[1,2,6,5],[4,5,6,7]])g.add(quadFace(f.map(i=>v[i]),deviceColor,.85,1.1,.14));
deviceGroup.add(g);return g;}

// The C-UAS readout is the same indicator as the track's and the Spider's: location
// box opening X then Y, plate sliding in, name decoding. It plays in the opening and
// stays open after it. Its lines are rebuilt as it opens, so fadeGroup leaves them
// alone (userData.live) and they take the C-UAS strength directly.
let deviceInd=null,deviceIndAt=Infinity;
function updateDeviceIndicator(it){
if(!deviceInd){deviceInd=buildIndicator(deviceGroup,deviceColor);devicePlateGroup.add(deviceInd.plateFill);
for(const k of ['box','boxFill','vert','minors','majors','plateLine','altFrame','plateFill'])deviceInd[k].userData.live=true;}
deviceIndAt=it;const o=deviceInd,op=opening.device,i=intro;
updateLocationBox(o,deviceColor,0,0,deviceHalf,ease(phase(it,i.boxAt,Math.max(.01,i.boxX))),ease(phase(it,i.boxAt+i.boxX,Math.max(.01,i.boxY))),op);
const p=beginText(deviceTextGroup);
updateNameplate(o,deviceColor,1,0,0,deviceHalf,decodedName('C-UAS',phase(it,i.plateAt,Math.max(.01,i.decodeDur)),it),
op,indicatorEase(phase(it,i.plateAt,Math.max(.01,i.plateDur))),null,'','',p,null);
endText(p);}

// An indicator is the whole acquisition readout - location box, vertical guide,
// altimeter, nameplate, altitude frame - and there are two of them now: the track's
// in orange and the Spider's in violet. Everything that draws one takes the set it
// is drawing into and the colour to draw it in, so the two never diverge.
function buildIndicator(g,color){
// The location box opens during the entrance and the nameplate slides in, so both
// are rebuilt every frame rather than built once.
const box=dynLine(color,.55,2.25);
const boxFill=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.025,side:THREE.DoubleSide,depthWrite:false}));
// Vertical guide, altimeter ticks, nameplate frame and altitude frame: all grow,
// slide or move with the entrance sequence.
const vert=dynLine(color,.38,.8),minors=dynLine(color,.32,.6),majors=dynLine(color,.5,.8);
const plateLine=dynLine(color,1,.8),altFrame=dynLine(color,.6,.8);
g.add(box,boxFill,vert,minors,majors,plateLine,altFrame);
// The plate fill glows at .4, so it lives in its own layer outside this group.
const plateFill=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({color,transparent:true,opacity:1,side:THREE.DoubleSide,depthWrite:false}));
plateFill.visible=false;targetPlateGroup.add(plateFill);
return {box,boxFill,vert,minors,majors,plateLine,altFrame,plateFill};}
function hideIndicator(o){for(const k of ['box','boxFill','vert','minors','majors','plateLine','altFrame','plateFill'])o[k].visible=false;}

function buildTarget(){
const g=new THREE.Group();
const ind=buildIndicator(g,targetColor);
// One placeholder body per craft in the formation: a swarm shows four, the single
// threats one. Each is a group so the per-threat scale carries its rim lines too.
const {rx,ry,hz}=bodyDims;
const geo=new THREE.CylinderGeometry(1,1,1,32,1,true);geo.rotateX(Math.PI/2);geo.scale(rx,ry,hz);
const rim=[],rimCol=[];
for(const zz of [hz,-hz])for(let i=0;i<32;i++){const a0=i/32*Math.PI*2,a1=(i+1)/32*Math.PI*2;
rim.push(Math.cos(a0)*rx,Math.sin(a0)*ry,zz,Math.cos(a1)*rx,Math.sin(a1)*ry,zz);
rimCol.push(targetColor.r,targetColor.g,targetColor.b,targetColor.r,targetColor.g,targetColor.b);}
for(let i=0;i<32;i+=8){const a=i/32*Math.PI*2;
rim.push(Math.cos(a)*rx,Math.sin(a)*ry,-hz,Math.cos(a)*rx,Math.sin(a)*ry,hz);
rimCol.push(targetColor.r,targetColor.g,targetColor.b,targetColor.r,targetColor.g,targetColor.b);}
const bodies=[];
for(let i=0;i<maxCraft;i++){const b=new THREE.Group();
b.add(new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:targetColor,transparent:true,opacity:.2,side:THREE.DoubleSide,depthWrite:false})),
lineSegs(rim,rimCol,lineMat(targetColor,1,1.25)));
b.visible=false;threatBodyGroup.add(b);bodies.push(b);}
// Corner brackets on the individual craft of a formation.
const marks=dynLine(targetColor,.7,1.1),debris=dynLine(targetColor,1,1);
// The response, in the C-UAS's colour because it is our side answering: solid for
// what is flying (interceptor, Spider, net), faint for what is only a wake (the
// dotted trail, the jamming fronts). Both live here so the response glows, mirrors
// and fades with the engagement it belongs to.
const respMain=dynLine(spiderColor,.85,1.3),respFaint=dynLine(deviceColor,.7,1);
// The net on its own, so it can fade out with the wreck it holds.
const respNet=dynLine(spiderColor,.85,1.3);
// The jamming sector: its fronts, and the two heavier lines that bound it.
const respJam=dynLine(jamColor,1,.7,.7),respJamEdge=dynLine(jamColor,1,2.6);
// The suppression bracket and its plate frame.
const killMarks=dynLine(killColor,.9,1.3),killLine=dynLine(killColor,1,.8);
g.add(marks,debris,respMain,respFaint,respNet,respJam,respJamEdge,killMarks,killLine);
// The asset the threat is flying at: a green location box with its ASSET plate, the
// red crosshair the threat has put on it, the pulse that sends while the threat is
// still coming, and the dashed curve from the threat down onto it.
const assetBox=dynLine(assetColor,.55,2.25),assetBoxFill=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({color:assetColor,transparent:true,opacity:.025,side:THREE.DoubleSide,depthWrite:false}));
const assetMark=dynLine(targetColor,.9,1.2),assetPulse=dynLine(targetColor,.6,1),assetPath=dynLine(targetColor,.6,1),assetLine=dynLine(assetColor,1,.8);
g.add(assetBox,assetBoxFill,assetMark,assetPulse,assetPath,assetLine);
// The C-UAS's data link to the Spider: one thin straight line (minWidth lowered so it
// can go under the usual 1.2 px floor).
const linkLine=dynLine(deviceColor,.5,.55,.55);
g.add(linkLine);
const assetFill=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({color:assetColor,transparent:true,opacity:1,side:THREE.DoubleSide,depthWrite:false}));
assetFill.visible=false;targetPlateGroup.add(assetFill);
const killFill=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({color:killColor,transparent:true,opacity:1,side:THREE.DoubleSide,depthWrite:false}));
killFill.visible=false;targetPlateGroup.add(killFill);
// The Spider's own readout, in the same group so it glows, mirrors and goes with
// the engagement it belongs to.
const spider=buildIndicator(g,spiderColor);
targetGroup.add(g);
return {group:g,...ind,spider,bodies,debris,marks,respMain,respFaint,respNet,respJam,respJamEdge,killMarks,killLine,killFill,assetBox,assetBoxFill,assetMark,assetPulse,assetPath,assetLine,assetFill,linkLine};}

// Clip one plate edge at the reveal plane. Plate edges are axis aligned, so an edge
// is kept, dropped or shortened - never cut on a diagonal.
function clipSegX(a,b,minX){
let x0=a[0],x1=b[0];
if(x0<minX&&x1<minX)return null;
return [Math.max(x0,minX),a[1],Math.max(x1,minX),b[1]];}

// Location box: the X line comes first, then the box opens in Y.
function updateLocationBox(o,color,x,y,half,growX,growY,opacity){
const hx=half*growX,hy=half*growY;
if(growX<=0){o.box.visible=false;o.boxFill.visible=false;return;}
if(growY<=0){setLine(o.box,[x-hx,y,boxZ,x+hx,y,boxZ],color,opacity,.55);o.boxFill.visible=false;return;}
const c=[[x-hx,y-hy],[x+hx,y-hy],[x+hx,y+hy],[x-hx,y+hy]],pos=[];
for(let i=0;i<4;i++){const a=c[i],b=c[(i+1)%4];pos.push(a[0],a[1],boxZ,b[0],b[1],boxZ);}
setLine(o.box,pos,color,opacity,.55);
o.boxFill.visible=true;o.boxFill.material.opacity=.025*opacity;
o.boxFill.position.set(x,y,boxZ);o.boxFill.scale.set(hx*2,hy*2,1);}

// Altimeter on the vertical guide: a tick every 10 ft, longer every 50. Ticks sit
// left of the line (the current altitude reads on the right) and appear as it grows.
function updateAltimeter(o,color,x,y,topZ,progress,opacity){
if(progress<=0){o.minors.visible=false;o.majors.visible=false;return;}
const top=boxZ+(topZ-boxZ)*progress,ftToZ=.3048/worldMetres,minor=[],major=[];
for(let ft=Math.ceil(boxZ/ftToZ/10)*10;ft*ftToZ<=top;ft+=10){const z=ft*ftToZ,big=ft%50===0;
(big?major:minor).push(x,y,z,x-(big?.2:.1),y,z);}
setLine(o.minors,minor,color,opacity,.32);
setLine(o.majors,major,color,opacity,.5);}

// Nameplate. Fill, frame and the name slide in together from behind the plate's left
// edge (the 2D pass clipped them to the plate's final bounds); the telemetry under it
// types itself in instead, then counts up.
function updateNameplate(o,plateColor,dir,x,y,half,text,opacity,reveal,telemetry,label,resp,platePool,textPool){
const {z,w,h,x:cx,y:cy}=nameplate(x,y,half,dir),left=cx-w/2,color=hex(plateColor);
if(reveal<=0||opacity<=0){o.plateLine.visible=false;o.plateFill.visible=false;return;}
const sx=cx-w*(1-reveal),vis0=Math.max(sx-w/2,left),vis1=sx+w/2;
o.plateFill.visible=true;o.plateFill.material.opacity=opacity;
o.plateFill.position.set((vis0+vis1)/2,cy,z);o.plateFill.scale.set(vis1-vis0,h,1);
const c=[[sx-w/2,cy-h/2],[sx+w/2,cy-h/2],[sx+w/2,cy+h/2],[sx-w/2,cy+h/2]],pos=[];
for(let i=0;i<4;i++){const seg=clipSegX(c[i],c[(i+1)%4],left);
if(seg)pos.push(seg[0],seg[1],z,seg[2],seg[3],z);}
setLine(o.plateLine,pos,plateColor,opacity,1);
flatText(platePool,text,sx,cy,z,1.65,h,'#ffffff',opacity,700,.8,'center',left);
// The threat class sits directly under the plate: the identification the response is
// chosen from. The next stage appends that response (KE-SHOT / NET-GUN / RF-JAM).
// The threat class, then the response appended to it in the C-UAS's colour. The
// two are separate quads rather than one string: each glyph surface is 512 wide, and
// a string long enough to overflow it is squeezed narrower than every other row.
// A friendly's plate (no telemetry) can still carry this row - the Spider's TASKED.
// Rows fade with the plate's own reveal. On the way in that is already 1 by the time
// the first row types, so this only shows on the way out - where it is what keeps the
// numbers from sitting on the glass after the plate has gone.
const rowOpacity=opacity*reveal;
if(label){flatText(textPool,label,cx,cy-h/2-.41,z,w,.75,color,rowOpacity,500,.373,'left');
if(resp)flatText(textPool,' > '+resp,cx+textFraction(label,500,.373)*w,cy-h/2-.41,z,w,.75,hex(deviceColor),rowOpacity,500,.373,'left');}
if(!telemetry)return;
// Typed in order: speed and range values (no names) at the nameplate's left edge,
// then ETA (digits only, slightly larger) right of the plate, bottom-aligned with it.
// Numbers are bold, units regular, and the unit starts where the number's width ends.
const rows=telemetryRows(telemetry);let typed=telemetry.typed;
const typeRow=(row,rx,ry,fontRatio)=>{const value=row[0],unit=row[1],full=value+unit;
const n=Math.max(0,Math.min(full.length,Math.floor(typed)));typed-=full.length;
if(n<=0)return;
const cursor=n<full.length&&Math.floor(telemetry.t*6)%2===0?'_':'';
const shownValue=value.slice(0,n),shownUnit=unit.slice(0,Math.max(0,n-value.length));
flatText(textPool,shownValue+(shownUnit?'':cursor),rx,ry,z,w,.75,color,rowOpacity,700,fontRatio,'left');
if(!shownUnit)return;
flatText(textPool,shownUnit+cursor,rx+textFraction(value,700,fontRatio)*w,ry,z,w,.75,color,rowOpacity,400,fontRatio,'left');};
typeRow(rows[0],cx,cy-h/2-.75,.373);
typeRow(rows[1],cx,cy-h/2-1.09,.373);
typeRow(rows[2],cx+w+.15,cy-h/2+.14,.43);
// The grid cell types in last, under the two counters. It is the one row that never
// counts up, so it reads as a place rather than a measurement.
typeRow(rows[3],cx,cy-h/2-1.43,.373);}

// Altitude beside the target, in the world XZ plane. The 2D pass drew it in text
// units where 100 units is one em; the same units place the frame and the quad here.
const altEm=.25,altUnits=altEm/100,altFontRatio=.25;
const altQuadW=.6667/altFontRatio,altQuadH=altEm/altFontRatio,altQuadHalf=altQuadW/2/altUnits;
function updateAltitude(o,color,x,y,topZ,ft,opacity,slide,pool){
if(slide<=0||opacity<=0){o.altFrame.visible=false;return;}
const ax=x+.12,az=(boxZ+topZ)/2,text=ft.toFixed(1)+' ft';
// Sized from all-zero digits so the frame holds still while the value counts up.
measureCtx.font='300 100px '+uiFont;
const boxW=measureCtx.measureText(text.replace(/\d/g,'0')).width+56,shift=-(boxW+2)*(1-slide);
// Text units to world: +x follows the nameplate, -y follows height.
const at=(tx,tz)=>[ax+tx*altUnits,y,az-tz*altUnits];
const rect=[[shift,-72],[shift+boxW,-72],[shift+boxW,62],[shift,62]],pos=[];
for(let i=0;i<4;i++){const a=rect[i],b=rect[(i+1)%4];
if(a[0]<0&&b[0]<0)continue;
const p0=at(Math.max(a[0],0),a[1]),p1=at(Math.max(b[0],0),b[1]);
pos.push(p0[0],p0[1],p0[2],p1[0],p1[1],p1[2]);}
setLine(o.altFrame,pos,color,opacity,.6);
// The glyph origin sits 28 units in from the frame's left edge.
placeText(pool,text,at(28+shift+altQuadHalf,0),[altQuadW/2,0,0],[0,0,altQuadH/2],
hex(color),opacity,300,altFontRatio,'left','middle',false,ax);}

// A formation is one engagement, so it keeps one location box, one vertical and one
// nameplate, sized to go round the whole of it. What each drone gets instead is a
// corner bracket and a two-digit tag - enough to see three tracks inside the one
// contact without writing the same telemetry out three times. The brackets open with
// the bodies themselves, a fraction of a second apart, so the formation arrives
// already resolved into its parts.
const craftMark={half:.56,corner:.21,em:1.3*68/192*.62,weight:500,gap:.13,step:.14};
// Two digits land a few pixels tall, which is the case tightGlyph exists for: on the
// shared 512x192 layout the mipmap averages that much empty space in and the tag
// disappears. Same path the grid coordinates take.
function craftTagQuad(text,color){const g=tightGlyph(text,color,craftMark.weight);
return {tex:g.tex,ax:[g.w*craftMark.em/2,0,0],ay:[0,g.h*craftMark.em/2,0]};}
function updateCraftMarks(th,t,et,opacity,pool){
// The green suppression bracket lands on the same craft at almost the same size, so
// this one leaves as soon as the threat is down rather than waiting its turn in the
// reverse cascade. Two brackets on one drone read as one thick smear.
opacity*=1-clamp((t-th.kill)/.3);
if(th.craft<2||opacity<=0){target.marks.visible=false;return;}
const pos=[],color=hex(targetColor),r=craftMark.half;
for(let i=0;i<th.craft;i++){
const grow=ease(phase(et,entrance.craft+i*craftMark.step,.3));
if(grow<=0)continue;
const p=markPos(th,i,t),c=craftMark.corner*grow;
for(const sx of [-1,1])for(const sy of [-1,1]){
pos.push(p[0]+sx*r,p[1]+sy*r,p[2],p[0]+sx*(r-c),p[1]+sy*r,p[2]);
pos.push(p[0]+sx*r,p[1]+sy*r,p[2],p[0]+sx*r,p[1]+sy*(r-c),p[2]);}
const q=craftTagQuad(String(i+1).padStart(2,'0'),color);
// The tag hangs from the bracket's right edge, not under the craft's centre: the
// quad is placed by its centre, so pull it in by its own half width.
placeTexture(pool,q.tex,[p[0]+r-q.ax[0],p[1]-r-craftMark.gap-q.ay[1],p[2]],q.ax,q.ay,opacity*grow);}
if(!pos.length){target.marks.visible=false;return;}
setLine(target.marks,pos,targetColor,opacity,.7);}

// --- airframes ---------------------------------------------------------------
// The glb files live in 모델링/ but are carried inside this fragment, at the bottom,
// as base64 (모델링/embed.py puts them there): the fragment is dropped into other
// pages and opened from disk, and a relative fetch works in neither.
// A glb is authored Y-up in metres with the rotors as children of the body, so the

// Where the Spider is: it comes up already under way and slows into its station,

const spiderBody={arm:.3,rotor:.12,core:.1};

// The asset: where the threat is going. A green location box opens on the glass the

// The data link: the Spider is a node on the C-UAS's network, so it is tied back to it

// call, 2026-10-06; the interceptor and jammer had links too and lost them). It
// reaches out as the Spider comes up and then stays as long as the Spider does, fading
// out with its airframe at the end of the engagement (it used to pull back .6 s after
// the capture, well before the Spider went). The plate reads CONNECTED the moment it
// arrives, then TASKED > cell.

const L=linkPlan(th),f=ease(phase(t,L.on,S.grow));

// plate goes on the -x side: the two indicators stand about 1.5 units apart, and
// two plates on the same side would land on top of each other.
// The sequence runs from the moment it starts flying and plays backwards at the end
// of the engagement, the same way the track's does when it is put down.
function updateSpider(th,t,opacity,platePool,textPool){
const r=th.resp,o=target.spider;

// it is ours and already known, so there is nothing to acquire.

groundMirrorBoost(false);

blurInto(rtMirrorRings.texture,rtMirrorRings,rtScratch,groundReflectionBlur*px,blurWide);
planeBlurInto(rtMirrorDots.texture,rtMirrorDots,rtScratch,groundDistanceBlur*px,dotReflectionBlur*px);
stackInto(rtMirrorDots.texture,rtMirrorRings.texture,rtMirrorGround);
world.scale.z=-1;world.updateMatrixWorld(true);
renderGroups([deviceMaskGroup],rtMask);
world.scale.z=1;world.updateMatrixWorld(true);
blurInto(rtMask.texture,rtMaskBlur,rtScratch,4*px);
maskGroundInto(rtMirrorGround.texture,rtMaskBlur.texture,rtMirrorGroundMasked,.95*opening.device*opening.deviceGate);}

function resize(){
W=root.clientWidth;H=root.clientHeight||W*9/16;if(!W||!H)return;
frameCamera();applyCamera();
const dpr=Math.min(devicePixelRatio||1,2);
renderer.setPixelRatio(dpr);renderer.setSize(W,H,false);
for(const m of lineMaterials)m.resolution.set(W,H);
dotMaterial.uniforms.uF.value=F;dotMaterial.uniforms.uPixelRatio.value=dpr;
dotMaterial.uniforms.uResolution.value.set(Math.max(1,Math.round(W*dpr)),Math.max(1,Math.round(H*dpr)));
const w=Math.max(1,Math.round(W*dpr)),h=Math.max(1,Math.round(H*dpr));
for(const t of fullRes)t.setSize(w,h);

const hw=Math.max(1,Math.round(w/2)),hh=Math.max(1,Math.round(h/2));
for(const t of [rtHalf,rtHalfScratch,rtHaloWide])t.setSize(hw,hh);
// The object mirror is blurred so hard it can live on a small buffer; the 2D pass
// picks its size the same way, from the blur radius.
reflectionScale=Math.min(.5,Math.max(.25,4/(reflectionBlur*F/736*dpr)));
const mw=Math.max(1,Math.round(w*reflectionScale)),mh=Math.max(1,Math.round(h*reflectionScale));
for(const t of [rtMirrorObj,rtMirrorScratch])t.setSize(mw,mh);
markBaseDirty();}
new ResizeObserver(resize).observe(root);
new MutationObserver(()=>{deviceColor=cssColor('--viz-series-1','#38bdf8');killColor=cssColor('--viz-series-3','#4ade80');spiderColor=deviceColor;updateDeviceIndicator(deviceIndAt);markBaseDirty();})
.observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
resize();

const pixelBlocks=[14,10,7,5,3,2],pixelStep=.24;let pixelBlock=1;
// Shards off a hard kill. Each is a small ragged triangle thrown from the impact:
// outward at its own speed, a kick upward, carrying some of the craft's own run,
// then gravity, spinning as it goes and stopping on the glass. Seeded per shard so
// every loop breaks up the same way.
function updateDebris(th,t,opacity){
const d=th.resp.debris,age=t-th.kill;
if(!d||age<=0||age>=d.life||opacity<=0){target.debris.visible=false;return;}
const c=trackAtU(th,th.endU),al=th.axis.along,pos=[],fades=[];
const rnd=(k,j)=>{const x=Math.sin(k*127.1+j*311.7)*43758.5453;return x-Math.floor(x);};
const f=1-Math.pow(age/d.life,1.5),floor=.02;
for(let k=0;k<d.count;k++){
const az=rnd(k,1)*Math.PI*2,el=(rnd(k,2)-.35)*1.2,sp=d.speed[0]+(d.speed[1]-d.speed[0])*rnd(k,3);
const v=[Math.cos(az)*Math.cos(el)*sp+al[0]*d.carry,Math.sin(az)*Math.cos(el)*sp+al[1]*d.carry,Math.sin(el)*sp+d.kick];
let tt=age;
// Where it lands it stays: solve the fall for the time it reaches the glass.
const a=d.gravity/2,disc=v[2]*v[2]+4*a*(c[2]-floor),land=(v[2]+Math.sqrt(disc))/(2*a);
tt=Math.min(tt,land);
const q=[c[0]+v[0]*tt,c[1]+v[1]*tt,c[2]+v[2]*tt-a*tt*tt];
const size=d.size[0]+(d.size[1]-d.size[0])*rnd(k,4),spin=(rnd(k,5)-.5)*18*tt;
const ax=rnd(k,6)*Math.PI*2,e1=[Math.cos(ax),Math.sin(ax),0],e2=[-Math.sin(ax)*.5,Math.cos(ax)*.5,.87];
const pts=[0,2.3,4.1].map((th0,j)=>{const g=th0+spin,rr=size*(j?.6+.4*rnd(k,7+j):1);
return [q[0]+(Math.cos(g)*e1[0]+Math.sin(g)*e2[0])*rr,q[1]+(Math.cos(g)*e1[1]+Math.sin(g)*e2[1])*rr,
Math.max(floor,q[2]+(Math.cos(g)*e1[2]+Math.sin(g)*e2[2])*rr)];});
for(let j=0;j<3;j++){pos.push(...pts[j],...pts[(j+1)%3]);fades.push(f,f);}}
setLine(target.debris,pos,targetColor,opacity,1,fades);}

function updateTarget(th,t){
// The airframes are standing objects rather than line lists rebuilt each frame, so
// they are put away at the top and only the engagement that owns it brings it back.
interceptor.hide();spiderModel.hide();for(const k in threatModels)for(const m of threatModels[k])m.hide();
for(const b of target.bodies)b.visible=false;
// Threat airframes resolve in: drawn in blocks that shrink every .24 s, from 14 CSS
// pixels down to full resolution about a second and a half after it appears.
const step=Math.floor(t/pixelStep);pixelBlock=step>=0&&step<pixelBlocks.length?pixelBlocks[step]:1;
// Pools are reset every frame: telemetry grows a row at a time as it types itself in.
const textPool=beginText(targetGroup),platePool=beginText(targetTextGroup);
const models=th.model&&threatModels[th.model]||[],lead=models[0];
const [x,y,z]=centreAt(th,t),topZ=z-(lead&&lead.ready?lead.below:th.hz);
// The acquisition sequence is the only thing driving box, guide, altimeter, plate
// and brackets, so putting the threat down is a matter of running its clock
// backwards: same phases, same order, played out. The counters are on absolute time
// and so do not count back down - they simply go with the plate that carries them.
const et=t>=th.kill?entranceSpan*Math.max(0,1-(t-th.kill)/th.close):t*entranceRate;
const opacity=t>th.fadeAt?Math.max(0,1-(t-th.fadeAt)/1.1):Math.min(1,t*entranceRate*2);
target.group.visible=opacity>.01;
if(!target.group.visible){target.plateFill.visible=false;target.killFill.visible=false;target.spider.plateFill.visible=false;target.assetFill.visible=false;endText(textPool);endText(platePool);return y;}
// What plays out backwards keeps its brightness while it does: the retreat is the
// effect, and dimming it at the same time would only blur the order it leaves in.
const solid=t>=th.fadeAt?1:opacity;
updateLocationBox(target,targetColor,x,y,th.half,ease(phase(et,entrance.boxX,.3)),ease(phase(et,entrance.boxY,.45)),opacity);
// The cell the target stands in, for the nameplate's GRID row. The lattice's own tag
// is left alone: the coordinates are a fixed map, not a readout that reacts.
const cell=cellAt(x,y);
// A wreck on the glass sits below the location plane, and the guide has nothing
// left to measure: it is clamped at the plane rather than drawn downward.
const vertical=ease(phase(et,entrance.vertical,.65)),vTop=Math.max(boxZ,topZ);
if(vertical>0&&(vTop-boxZ)*vertical>.02)setLine(target.vert,[x,y,boxZ,x,y,boxZ+(vTop-boxZ)*vertical],targetColor,opacity,.38);
else target.vert.visible=false;
updateAltimeter(target,targetColor,x,y,vTop,vertical,opacity);
// One body per craft in the formation; the spare bodies stay hidden.
const rot=tumble(th,t);
target.bodies.forEach((b,i)=>{if(i>=th.craft){b.visible=false;return;}
const bodyOpacity=opacity*bodyFade(th,i,t);b.visible=bodyOpacity>.01;if(!b.visible)return;
const p=craftPos(th,i,t),model=models[i];
// A threat with its own airframe flies it nose-first along the track: heading and
// climb off the track either side of now, held at the last heading once it stops.
// A netted one keeps that heading and tumbles about it.
if(model){const tt=Math.min(t,th.arrive-.06),a=craftPos(th,i,tt-.05),c=craftPos(th,i,tt+.05);
let dx=c[0]-a[0],dy=c[1]-a[1];const dz=c[2]-a[2];
if(Math.hypot(dx,dy)<1e-4){dx=th.axis.along[0];dy=th.axis.along[1];}
// Once hit it noses over as it goes down.
const dive=th.resp.fall?fallEase(clamp((t-fallStart(th,i))/th.resp.fall))*1.1:0;
const spin=rot?[rot[0]+i,rot[1],rot[2]]:[0,0,0];
let pitch=Math.atan2(dz,Math.hypot(dx,dy));
// Speed is taken over +-.3 s so the lean eases off across the stop instead of
// snapping level on the frame the track ends.
if(th.lean){const hs=u=>{const e=craftAt(th,i,u-.3),f=craftAt(th,i,u+.3);return Math.hypot(f[0]-e[0],f[1]-e[1])/.6;};
if(th.cruise===undefined)th.cruise=hs(th.arrive/2)||1;
pitch=-th.lean*Math.min(1,hs(t)/th.cruise);}
if(model.place(p,Math.atan2(dy,dx)+spin[2],pitch-dive+spin[0],t,bodyOpacity,1,Infinity,spin[1])){b.visible=false;return;}}b.position.set(p[0],p[1],p[2]);b.scale.set(th.scale[0],th.scale[1],th.scale[2]);
if(rot)b.rotation.set(rot[0]+i,rot[1],rot[2]);else b.rotation.set(0,0,0);
b.traverse(n=>{if(n.material&&'opacity' in n.material){
if(n.userData.baseOpacity===undefined)n.userData.baseOpacity=n.material.opacity;
n.material.opacity=n.userData.baseOpacity*bodyOpacity;}});});
// Readouts are staged: the plate slides in, the rows type, then the values count up.
// Sensor-like jitter: a deterministic offset every .3 s, wider on a swarm track.
const tick=Math.floor(t/.3),jitter=(Math.floor(Math.abs(Math.sin(tick*12.9898)*43758.5453)%3)-1)*th.jitter;
// Speed is measured off the track itself, so each threat's own pace, weave and hover
// read out of the same numbers instead of being written twice.
// Measured off the centre, which now includes a fall, so a wreck reads its own
// descent rate instead of standing at zero all the way down.
const dt=.05,pA=centreAt(th,t-dt),pB=centreAt(th,t+dt);
const raw=Math.hypot(pB[0]-pA[0],pB[1]-pA[1],pB[2]-pA[2])/(2*dt)*worldMetres*3.6;
const speed=raw>1?raw+jitter:0;
const range=Math.hypot(x,y)*worldMetres;
const typeStart=(entrance.labels+.45)/entranceRate,typed=(t-typeStart)*typingRate;
const count=ease(phase(t,typeStart+telemetryChars/typingRate+.1,.9));
// The class decodes just after the name does.
const labelAt=(entrance.decode+.3)/entranceRate;
// ETA only means something on the way in; once the response has it, the row stops.
const closing=t<th.arrive&&speed>0;
updateNameplate(target,targetColor,1,x,y,th.half,decodedName('TARGET',phase(t,entrance.decode/entranceRate,.7),t),
opacity,indicatorEase(phase(et,entrance.labels,.45)),
{speed:speed*count,distance:range*count,eta:closing?range/(speed/3.6)*count:Infinity,cell:cell?cell.name:'---',typed,t},
t>=labelAt?decodedName(th.label||th.id,phase(t,labelAt,.7),t):'',
t>=th.resp.at?decodedName(th.resp.tag,phase(t,th.resp.at,.7),t):'',platePool,textPool);
updateCraftMarks(th,t,et,opacity,textPool);
updateDebris(th,t,opacity);
updateResponse(th,t,opacity,textPool);
updateLink(th,t,opacity);
updateSpider(th,t,solid,platePool,textPool);
updateKillMark(th,t,solid,platePool,textPool);
updateAsset(th,t,opacity,platePool);
const altitudeCount=ease(phase(t,(entrance.altitude+.45)/entranceRate,.9));
updateAltitude(target,targetColor,x,y,topZ,z*worldMetres/.3048*altitudeCount,opacity,indicatorEase(phase(et,entrance.altitude,.45)),textPool);
endText(textPool);endText(platePool);
return y;}

// --- opening: the hologram switching on over the bare glass ------------------------
// Every visit opens on the glass grid alone. The dot field rises out of the glass from
// the front rows back, the C-UAS follows it up, then the bearing ring grows out of the
// C-UAS small to full size with its ticks, letters and numbers at once - its dial set
// to the C-UAS front as 0. Once it is all out, the dial turns under the fixed heading
// line until that line reads the bearing the C-UAS actually faces. While it rises the
// C-UAS indicator opens like a track's (updateDeviceIndicator). The first threat
// comes in at threatAt. All timings are in `intro`, up with the entrance constants.

// Fades a whole static group by its materials, each against the opacity it was built with.
const builtOpacity=new WeakMap();
function fadeGroup(g,f){g.traverse(o=>{const m=o.material;if(!m||o.userData.live)return;
const u=m.uniforms&&m.uniforms.opacity;
if(!builtOpacity.has(m))builtOpacity.set(m,u?u.value:m.opacity);
if(u)u.value=builtOpacity.get(m)*f;else m.opacity=builtOpacity.get(m)*f;});}
const easeOut=p=>1-Math.pow(1-p,3);
function applyIntro(it){
const u=dotMaterial.uniforms;
u.uIntro.value=Math.min(it,1e4);u.uDotAt.value=intro.dotAt;u.uDotDur.value=Math.max(.01,intro.dotDur);
u.uSweep.value=intro.dotSweep;u.uRise.value=intro.dotRise;
const d=phase(it,intro.deviceAt,Math.max(.01,intro.deviceDur)),dz=-intro.deviceRise*(1-easeOut(d));
for(const g of [deviceGroup,devicePlateGroup,deviceTextGroup,deviceMaskGroup])g.position.z=dz;
opening.device=d;opening.deviceGate=clamp((boxZ+dz)/boxZ);
fadeGroup(deviceGroup,d);fadeGroup(devicePlateGroup,d);updateDeviceIndicator(it);
const r=phase(it,intro.ringAt,Math.max(.01,intro.ringDur)),s=intro.ringFrom+(1-intro.ringFrom)*easeOut(r);
ringGroup.scale.set(s,s,1);
// Shortest way round from the front-as-zero dial to the real bearing.
const turn=((headingTo-headingFrom)%360+540)%360-180;
const heading=headingFrom+turn*ease(phase(it,intro.turnAt,Math.max(.01,intro.turnDur)));
dialGroup.rotation.z=(heading-headingTo)*Math.PI/180;
const shown=Math.round((heading%360+360)%360)%360;
if(shown!==headingShown)drawHeading(shown);
fadeGroup(ringGroup,clamp(r*2));}
// ms; null while it waits for the page to show this frame, -Infinity once played.
let introStart=null;
// Tuning panel's scrub: holds the opening at this second (null = play).
let introFreeze=null;

// One threat per loop, drawn at random and never the same one twice in a row. Each
// threat sets its own loop length, since they do not take equally long to arrive.
let threat=threats[Math.floor(Math.random()*threats.length)],loopStart=performance.now();
// On the AEGIS page this runs inside the COMMAND step's iframe (#cmdMap), which the page
// fades in only on that step. While it is hidden nothing is drawn, and the page calls
// __aegisReset as it shows it, so every visit starts a fresh threat from the top.
const host=(()=>{try{const f=window.frameElement;return f&&f.id==='cmdMap'?f:null;}catch(e){return null;}})();
function startIntro(now){introStart=now;loopStart=now+intro.threatAt*1000;}
window.__aegisReset=()=>{const others=threats.filter(o=>o!==threat);
threat=others[Math.floor(Math.random()*others.length)];startIntro(performance.now());};
// On its own the preview opens straight away; in the page it waits to be shown.
if(!host)startIntro(performance.now());
// Timing panel: every value a motion's timing hangs on, live, in the preview alone (the
// page's frame never shows it). A motion hands over its value object and its rows
// [key, label, min, max, step]; each change restarts it, the scrub holds one moment,
// and the line at the bottom is the object to paste back into the source.
// Keep timing-critical motion tunable this way rather than hard-coding guesses.
function tunePanel(title,values,rows,restart,scrub){
const box=document.createElement('div');
box.style.cssText='position:fixed;top:8px;right:8px;z-index:9;background:rgba(0,0,0,.78);color:#cfe8ff;font:11px/1.3 monospace;padding:8px 10px;border:1px solid #2a4a66;max-height:96vh;overflow:auto;width:300px;box-sizing:border-box';
const head=document.createElement('div');head.style.cssText='cursor:pointer;color:#fff;margin-bottom:4px';
const body=document.createElement('div');head.textContent=title+' \u25be';
head.onclick=()=>{const open=body.style.display==='none';body.style.display=open?'':'none';head.textContent=title+(open?' \u25be':' \u25b8');};
const slider=(min,max,step,value)=>{const r=document.createElement('input');Object.assign(r,{type:'range',min,max,step,value});
r.style.cssText='width:110px;vertical-align:middle;margin:0 6px';return r;};
const out=document.createElement('div');out.style.cssText='margin-top:6px;white-space:pre-wrap;word-break:break-all;user-select:all;color:#8fb';
const show=()=>{out.textContent=JSON.stringify(values);};
for(const [k,label,min,max,step] of rows){const row=document.createElement('label');row.style.cssText='display:block;margin:2px 0';
const v=document.createElement('span');v.textContent=values[k];const r=slider(min,max,step,values[k]);
r.oninput=()=>{values[k]=+r.value;v.textContent=r.value;show();restart();};
row.append(label,r,v);body.append(row);}
const hold=document.createElement('label');hold.style.cssText='display:block;margin:6px 0 4px;color:#fd8';
const on=document.createElement('input');on.type='checkbox';
const at=slider(0,scrub.max,.05,0),atV=document.createElement('span');atV.textContent='0';
const sync=()=>{atV.textContent=at.value;scrub.set(on.checked?+at.value:null);if(!on.checked)restart();};
on.onchange=sync;at.oninput=()=>{on.checked=true;sync();};
hold.append(on,' 시점 고정',at,atV);
const again=document.createElement('button');again.textContent='다시 재생';
again.onclick=()=>{on.checked=false;scrub.set(null);restart();};
body.append(hold,again,out);box.append(head,body);show();document.body.append(box);}
if(!host)tunePanel('진입 모션',intro,[
['dotAt','망점 시작',0,2,.05],['dotDur','망점 한 점 시간',.1,2,.05],['dotSweep','망점 앞→뒤 물결',0,2,.05],['dotRise','망점 상승 깊이',0,4,.1],
['deviceAt','C-UAS 시작',0,3,.05],['deviceDur','C-UAS 시간',.1,2,.05],['deviceRise','C-UAS 상승 깊이',0,4,.1],
['boxAt','C-UAS 박스 시작',0,3,.05],['boxX','박스 X선 시간',.05,1,.05],['boxY','박스 Y 펼침 시간',.05,1,.05],
['plateAt','C-UAS 이름표 시작',0,3,.05],['plateDur','이름표 슬라이드 시간',.05,1,.05],['decodeDur','이름 디코드 시간',.05,1.5,.05],
['ringAt','방위 시작',0,3,.05],['ringDur','방위 커지는 시간',.1,2,.05],['ringFrom','방위 시작 크기',0,1,.05],
['turnAt','다이얼 회전 시작',0,4,.05],['turnDur','다이얼 회전 시간',.1,3,.05],['threatAt','위협 등장',0,5,.1]],
()=>startIntro(performance.now()),{max:5,set:v=>{introFreeze=v;}});
function frame(now){
if(!root.isConnected)return;
if(W&&H&&!(host&&!host.classList.contains('show'))){
// Shown before the page could call __aegisReset (the frame was still loading).
if(introStart===null)startIntro(now);
if(introFreeze!==null){introStart=now-introFreeze*1000;loopStart=introStart+intro.threatAt*1000;}
let t=(now-loopStart)/1000;
if(t>=threat.loop){const others=threats.filter(o=>o!==threat);
threat=others[Math.floor(Math.random()*others.length)];loopStart=now;t=0;}
draw(threat,t,(now-introStart)/1000);}
requestAnimationFrame(frame);}
function draw(th,t,it=Infinity){
const dpr=renderer.getPixelRatio(),px=F/736*dpr;
const targetYNow=updateTarget(th,t);
// The opening moves the static layers, so the base is rebuilt every frame of it and
// once more on the frame it ends, which leaves everything at rest.
const playing=introStart!==null&&introStart!==-Infinity;
if(playing){if(it>=introEnd()){it=Infinity;introStart=-Infinity;}applyIntro(it);baseDirty=true;}
if(baseDirty){baseDirty=false;buildBase(px);}
// The C-UAS mirror only shows once the C-UAS is above the glass.
if(playing)for(const g of [deviceGroup,devicePlateGroup])fadeGroup(g,opening.device*opening.deviceGate);
// Mirror through the glass, never lit. Grid lines lie on the glass itself, so the
// object mirror is the two objects with their plates; the ground mirror is cached.
world.scale.z=-1;world.updateMatrixWorld(true);
for(const c of clipPlanes)c.normal.z=1;
renderGroups(mirrorObjectGroups,rtMirrorObj);
for(const c of clipPlanes)c.normal.z=-1;
world.scale.z=1;world.updateMatrixWorld(true);
if(playing)for(const g of [deviceGroup,devicePlateGroup])fadeGroup(g,opening.device);
blurInto(rtMirrorObj.texture,rtMirrorObj,rtMirrorScratch,reflectionBlur*px*reflectionScale,blurWide);
// No threat on the glass (the opening, the gap between loops): its layer is empty,
// so its glow and blur passes are skipped and the glass goes straight out.
if(!target.group.visible){
stackInto(rtMirrorGroundMasked.texture,rtMirrorObj.texture,rtLayer,groundReflectionOpacity,reflectionOpacity);
stackInto(rtBaseBlur.texture,rtLayer.texture,rtScratch);
present.u.tSrc.value=rtScratch.texture;present.run(null);return;}
// The target layer: plate fill at its own glow with the names cut out of it, then
// the lines and lit text over it.
litLayer([targetPlateGroup],rtLitStatic,true,px,.4);
renderGroups([targetTextGroup],rtLayer);
cutTextInto(rtLitStatic.texture,rtLayer.texture,rtAccB);
if(pixelBlock>1)renderPixelated(pixelBlock);
litLayer([targetGroup],rtLitTarget,true,px);
threatBodyGroup.visible=true;pixQuad.visible=false;
stackInto(rtLitTarget.texture,rtAccB.texture,rtAccA);
// The target carries one radius, from its own world y, exactly as drawTargetBlurred did.
const k=Math.min(8,Math.max(0,(targetYNow-bandLow(0))/band-.5)),targetSigma=Math.max(0,k-1)*targetDistanceBlur*px;
if(targetSigma<.05){copy.u.tSrc.value=rtAccA.texture;copy.run(rtTargetBlur);}
else blurInto(rtAccA.texture,rtTargetBlur,rtScratch,targetSigma);
// Stack: object mirror, ground mirror, glass layers, target.
stackInto(rtMirrorGroundMasked.texture,rtMirrorObj.texture,rtLayer,groundReflectionOpacity,reflectionOpacity);
stackInto(rtBaseBlur.texture,rtLayer.texture,rtScratch);
stackInto(rtTargetBlur.texture,rtScratch.texture,rtAccA);
present.u.tSrc.value=rtAccA.texture;present.run(null);}
requestAnimationFrame(frame);
// The first frame compiles every shader and builds the ground - a few hundred ms, on the
// main thread the page shares with this iframe. Left to the moment the COMMAND step opens,
// it froze the page's copy typing. So while hidden, once the airframes are in, draw each
// threat through its approach, response and fall a frame at a time in idle moments.
if(host){const models=[interceptor,spiderModel,...Object.values(threatModels).flat()];
const idle=window.requestIdleCallback?f=>requestIdleCallback(f,{timeout:1500}):f=>setTimeout(f,200);
const queue=threats.flatMap(th=>[.5,th.resp.at+.3,(th.resp.at+th.arrive)/2,th.arrive+.6].map(t=>[th,t]));
const warm=()=>{if(!root.isConnected||host.classList.contains('show')||!queue.length)return;
if(!W||!H||!models.every(m=>m.ready)){setTimeout(()=>idle(warm),300);return;}
draw(...queue.shift());idle(warm);};
