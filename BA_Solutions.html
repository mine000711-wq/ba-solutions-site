<!DOCTYPE html>
<meta charset="UTF-8">
<html lang="en" data-i18n>
<head>
<script src="html/lang.js"></script>
<title>BA Solutions</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">

<style>

.sec-title {
  font-family: 'Michroma', 'Helvetica Neue', Helvetica, sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
::selection { background:#f0ede8; color:#000; }

body { background:#000; color:#f0ede8; font-family:'Helvetica Neue',Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; }
html { scrollbar-width:none; }
html::-webkit-scrollbar { display:none; }

:root { --u:calc(min(100vw, 1440px) / 1440); --pad:max(20px, calc(40 * var(--u)));}

#hero {
  width:100%; height:100vh; min-height:480px;
  background:#000; position:relative; overflow:hidden;

}

.domain {
  position:absolute; inset:0;
  transition:opacity .45s, filter .35s;
  opacity:.75; cursor:pointer;
}
.domain.active { opacity:1; }

#hero:hover .domain:not(.active) .domain-thumb,
#hero:hover .domain:not(.active) .domain-video,
#hero:hover .domain:not(.active) .dbg,
#hero:hover .domain:not(.active) .domain-overlay { filter:blur(4px); }
#hero:hover .domain:not(.active) .dlabel { opacity:.35; }
#hero:hover .domain.active .dlabel { opacity:1; }

#domain-air, #domain-sea, #domain-land { clip-path:none; }

.dbg { position:absolute; inset:0; z-index:0; background:#000; }

.domain-thumb {
  position:absolute; inset:0; z-index:1;
  width:100%; height:100%; object-fit:cover;
  opacity:0; transition:opacity .6s;
}
.domain-thumb.loaded { opacity:1; }

.domain-video {
  position:absolute; inset:0; z-index:2;
  width:100%; height:100%; object-fit:cover;
  opacity:0; transition:opacity .5s;
}
.domain-video.playing { opacity:1; }

.domain-overlay {
  position:absolute; inset:0; z-index:3;
  background:rgba(0,0,0,.12);
  transition:background .4s;
}
.domain.active .domain-overlay { background:rgba(0,0,0,.0); }

.domain::after {
  content:''; position:absolute; inset:0; z-index:4;
  background:rgba(240,237,232,0);
  transition:background .4s; pointer-events:none;
}
.domain.active::after { background:rgba(240,237,232,.03); }

#dividers {
  position:absolute; inset:0; pointer-events:none; z-index:5;
}

.dlabel {
  position:absolute; z-index:10; pointer-events:none;
  opacity:.55; transition:opacity .35s;
  left:var(--x); top:var(--y);

  transform:translate(var(--ax,-50%), -50%);
  white-space:nowrap;
}
.domain.active .dlabel { opacity:1; }

#domain-air  .dlabel { --x:var(--pad);              --y:30%; --ax:0;     text-align:left;   }
#domain-sea  .dlabel { --x:calc(100% - var(--pad)); --y:30%; --ax:-100%; text-align:right;  }
#domain-land .dlabel { --x:50%;               --y:83%; --ax:-50%;  text-align:center; }

.dlabel { min-width:min(400px, calc(100vw - var(--pad) * 2)); }

.dlabel .pname:last-child { text-align:center; }

.pname {
  --ls:0px;
  --lh:0.85;

  font-size:clamp(26px,22vw,120px);
  letter-spacing:var(--ls);
  line-height:var(--lh);

  margin-right:calc(var(--ls) * -1);

  transform:translateX(var(--kick,0px));
  color:#f0ede8; font-weight:700; display:block;
}

#domain-air  .pname:first-child { --kick:.05em; }

#center-logo {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  z-index:20; pointer-events:none;
  display:flex; flex-direction:column; align-items:center; gap:10px;
}
#logo-img {
  width:max(90px, calc(140 * var(--u))); height:max(90px, calc(140 * var(--u)));

  object-fit:contain;
}

#intro { display:none; }
html.intro-on #intro {
  display:block; position:absolute; inset:0; z-index:30;
  background:#000; overflow:hidden;
}
html.intro-on #intro.is-built { background:transparent; }
#intro .intro-bg,
#intro .intro-piece { position:absolute; inset:0; background:#000; will-change:transform; }
#intro .intro-lines { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
#intro .intro-mark { position:absolute; transform:translate(-50%,-50%); will-change:transform; }
#intro .intro-mark img { display:block; width:100%; height:100%; }

#intro .intro-word { position:absolute; left:100%; overflow:hidden; }
#intro .intro-word svg { position:absolute; top:0; height:100%; color:#f0ede8; will-change:transform; }

#hero-copy {
  position:absolute; bottom:clamp(48px,7vh,80px);
  left:50%; transform:translateX(-50%);
  text-align:center; z-index:20;
  pointer-events:none; white-space:nowrap;
}
#hero-copy .big { font-size:max(14px, calc(22 * var(--u))); letter-spacing:0; color:#f0ede8; font-weight:700; display:block; }

.decode { opacity:0; transition:opacity .1s; }
.decode.visible { opacity:1; }

#scanline { position:absolute; width:100%; height:1px; background:rgba(240,237,232,.04); z-index:6; animation:scan 5s linear infinite; pointer-events:none; }
@keyframes scan { 0%{top:0} 100%{top:100%} }

.particle { position:absolute; width:1.5px; height:1.5px; background:rgba(240,237,232,.35); border-radius:50%; pointer-events:none; z-index:7; animation:fl linear infinite; }
@keyframes fl { 0%{transform:translateY(0);opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{transform:translateY(-80px);opacity:0} }

section { width:100%; padding:200px var(--pad); position:relative; }
.sec-title { font-size:max(25px, calc(50 * var(--u))); letter-spacing:.1em; color:#f0ede8; font-weight:700; margin-bottom:48px; }

#products { background:#000; padding:0; }
#products .sec-title { padding:100px var(--pad) 0; margin-bottom:80px; }
.product-grid { display:flex; flex-direction:column; gap:1px; background:rgba(240,237,232,.08); }
.product-card {
  height:220px; position:relative; overflow:hidden;
  display:block; cursor:pointer; text-decoration:none;
  transition:height .45s cubic-bezier(.4,0,.2,1);
}
.product-card:hover { height:460px; }

.card-bg {
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; opacity:0;
  transition:opacity .5s, transform .6s ease, filter .4s;
}
.card-bg.loaded { opacity:1; }
.product-card:hover .card-bg { transform:scale(1.04); filter:brightness(1.15); }

.card-dark {
  position:absolute; inset:0; z-index:1;
  background:linear-gradient(to top, rgba(0,0,0,.82) 0%, rgba(0,0,0,.28) 55%, rgba(0,0,0,.1) 100%);
  transition:background .4s;
}
.product-card:hover .card-dark {
  background:linear-gradient(to top, rgba(0,0,0,.68) 0%, rgba(0,0,0,.18) 55%, rgba(0,0,0,.04) 100%);
}

.ph-grid {
  position:absolute; inset:0; z-index:2; pointer-events:none;
  background-image:linear-gradient(rgba(240,237,232,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(240,237,232,.025) 1px,transparent 1px);
  background-size:28px 28px; opacity:0; transition:opacity .3s;
}
.product-card:hover .ph-grid { opacity:1; }

.card-body {
  position:absolute; inset:0; z-index:3;
  display:flex; flex-direction:column; justify-content:flex-end;
  padding:28px 36px;
}
.card-name { font-size:35px; color:#f0ede8; font-weight:700; line-height:1.2; }
.card-arrow {
  margin-top:14px;
  font-size:13px; font-weight: 500;color:rgba(240,237,232,.85);
  border-bottom:0.5px solid rgba(240,237,232,.35); padding-bottom:2px;
  width:fit-content; opacity:0; transform:translateY(6px);
  transition:opacity .35s, transform .35s;
}
.product-card:hover .card-arrow { opacity:1; transform:translateY(0); }

#vision {
  background:#000;
  padding:0; position:relative; overflow:hidden;
  display:flex; align-items:flex-end; cursor:pointer;
}
.vision-bg {
  position:absolute; inset:0; z-index:0;
}
.vision-bg img {
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; opacity:0; transition:opacity .8s, filter .5s, transform .6s;
}
.vision-bg .v-grid {
  position:absolute; inset:0; z-index:1;
  background-image:linear-gradient(rgba(240,237,232,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(240,237,232,.02) 1px,transparent 1px);
  background-size:32px 32px;
}
.vision-bg-overlay {
  position:absolute; inset:0; z-index:2;
  background:linear-gradient(to right, rgba(0,0,0,.35) 30%, rgba(0,0,0,0) 100%);
  transition:background .5s;
}
.vision-content {

  position:relative; z-index:60;

  padding:40px var(--pad); display:flex; flex-direction:column; gap:16px; max-width:600px;
}
.vision-quote {
  font-size:max(28px, calc(48 * var(--u)));
  color:#f0ede8; font-weight:700; line-height:1.15;
}
.vision-tagline {
  font-size:13px; color:rgba(240,237,232,.85); line-height:1.7; text-transform:uppercase;
}

#vision-reveal-wrap {
  position:relative;
  height:250vh;
}
#vision-sticky {
  position:sticky; top:0;
  height:100vh; overflow:hidden;
}
#vision-sticky #vision {
  height:100vh; min-height:100vh;
}
#vision-curtain {

  position:absolute; left:0px; right:0px; top:0;
  height:100%; background:#000;
  z-index:50; pointer-events:none;

  transform-origin:top center;
  transform:scaleY(1);
  will-change:transform;
}

#news { background:#000; }
.news-inner { display:flex; flex-direction:column; }

.news-featured {
  display:grid; grid-template-columns:1fr 1fr;
  background:#f0ede8;
}
.news-featured-body {
  padding:36px var(--pad);
  display:flex; flex-direction:column; gap:14px;
  cursor:pointer;
}
.news-featured-body:hover .news-title-featured { color:#0a0a0c; }
.news-feat-date { font-size:11px; letter-spacing:0; color:rgba(10,10,12,.6); }
.news-title-featured {
  font-size:max(15px, calc(25 * var(--u))); color:rgba(10,10,12,.85);
  line-height:1.55; font-weight:700; transition:color .3s;
}
.news-featured-img {
  background:#000;
  position:relative; overflow:hidden;
  height:286px;
  display:flex; align-items:center; justify-content:center;
}

.news-featured-img img {
  position:absolute; inset:0; z-index:2;
  display:block; width:100%; height:100%; object-fit:cover;
}
.news-featured-img .ni-ph { position:absolute; }
.news-featured-img .ni-grid {
  position:absolute; inset:0;
  background-image:linear-gradient(rgba(240,237,232,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(240,237,232,.02) 1px,transparent 1px);
  background-size:20px 20px;
}
.ni-ph { text-align:center; z-index:1; }
.ni-ph .ni-icon { font-size:36px; opacity:.07; display:block; }
.ni-ph .ni-label { font-size:9px; letter-spacing:0; color:rgba(240,237,232,.14); margin-top:8px; display:block; }

@media (max-width:780px){
  .news-featured { grid-template-columns:1fr; }

  .news-featured-img {
    order:-1;
    border-left:none;
    height:auto;
  }

  .news-featured-img img { position:relative; height:auto; }

  .news-featured-body { padding:32px var(--pad) 36px; }
}

.news-sub-list { display:flex; flex-direction:column; }

.news-sub-block { background:#000; }
.news-sub-item {
  padding:20px 20px 6px 40px;

  position:relative;

  display:flex; flex-direction:column; align-items:flex-start; gap:10px;
  cursor:pointer; transition:opacity .2s;
}
.news-sub-item::after {
  content:''; position:absolute; left:20px; right:20px; bottom:0;
  height:0.5px; background:#f0ede8;
}

.news-sub-item:last-child::after { display:none; }

.news-sub-row {
  width:100%; display:flex; align-items:baseline;
  justify-content:space-between; gap:24px;
}

.news-sub-item { --read-x:20px; --read-y:14px; }
.news-sub-item .arrow-link {
  position:absolute;
  right:var(--read-x);
  bottom:var(--read-y);
  align-self:auto;
}

.news-sub-row { padding-right:140px; }
.news-sub-item:hover { opacity:1; }
.news-sub-item:hover .news-title-sub { color:#f0ede8; }
.news-title-sub {

  font-size:max(15px, calc(20 * var(--u))); font-weight:700; letter-spacing:0; color:rgba(240,237,232,.85);
  line-height:2; transition:color .3s;
  position: relative; top: -10px;
}
.news-sub-date { font-size:11px; letter-spacing:0; color:rgba(240,237,232,.65); white-space:nowrap; }

.news-sub-divider {
  height:1px;
  background:#f0ede8;
}

.news-show-more { padding:28px 20px 0 0; text-align:right; }

.arrow-link {
  display:inline-block;
  font-size:max(10px, calc(12 * var(--u)));
  letter-spacing:0;
  color:rgba(240,237,232,.55);
  text-decoration:none;
  border-bottom:1px solid rgba(240,237,232,.3);
  padding-bottom:3px;
  transition:color .3s, border-color .3s;
  white-space:nowrap;
  align-self:flex-start;
}
.arrow-link:hover,
.news-featured-body:hover .arrow-link { color:#f0ede8; border-color:#f0ede8; }

.news-featured .arrow-link { color:rgba(10,10,12,.55); border-bottom-color:rgba(10,10,12,.3); }
.news-featured .arrow-link:hover,
.news-featured-body:hover .arrow-link { color:#0a0a0c; border-color:#0a0a0c; }

.news-sub-item:hover .arrow-link { color:#f0ede8; border-color:#f0ede8; }

#products, #news { position:relative; }
</style>

<script>
(function(){
  var nav = window.performance && performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce || location.hash || (nav && nav.type === 'back_forward')) return;

<script>

const hero    = document.getElementById('hero');
const doms    = {
  air:  document.getElementById('domain-air'),
  sea:  document.getElementById('domain-sea'),
  land: document.getElementById('domain-land'),
};
const domLinks = { air:'html/ba_air.html', sea:'html/ba_sea.html', land:'html/ba_land.html' };
let curDom = null;

function getDom(x, y, w, h) {
  const cx = w * .5, cy = h * .5;
  const dx = x - cx, dy = y - cy;
  const dirs = { air:[-0.866,-0.5], sea:[0.866,-0.5], land:[0,1] };
  let best = null, bestDot = -Infinity;
  Object.keys(dirs).forEach(k => {
    const dot = dx*dirs[k][0] + dy*dirs[k][1];
    if (dot > bestDot) { bestDot = dot; best = k; }
  });
  return best;
}

function updateClipPaths() {
  const W = hero.clientWidth, H = hero.clientHeight;
  const cx = W * 0.5, cy = H * 0.5;

  function ray(angleDeg) {
    const a = angleDeg * Math.PI / 180;
    const dx = Math.cos(a), dy = Math.sin(a);
    const ts = [];
    if (dx >  1e-9) ts.push((W - cx) / dx);
    if (dx < -1e-9) ts.push((0  - cx) / dx);
    if (dy >  1e-9) ts.push((H - cy) / dy);
    if (dy < -1e-9) ts.push((0  - cy) / dy);
    const t = Math.min(...ts.filter(v => v > 1e-4));
    return [cx + dx * t, cy + dy * t];
  }

  const pAS = ray(-90);
  const pAL = ray(150);
  const pSL = ray(30);

  const fmt = pts => 'polygon(' + pts.map(p => `${p[0].toFixed(1)}px ${p[1].toFixed(1)}px`).join(', ') + ')';

  doms.air.style.clipPath  = fmt([[cx,cy], pAS, [0,0], [0,H], pAL]);

  doms.sea.style.clipPath  = fmt([[cx,cy], pSL, [W,H], [W,0], pAS]);

  doms.land.style.clipPath = fmt([[cx,cy], pAL, [0,H], [W,H], pSL]);

  const svg = document.getElementById('dividers');
  if (svg) {
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.innerHTML = '';
    [pAS, pAL, pSL].forEach(p => {
      const ln = document.createElementNS('http://www.w3.org/2000/svg','line');
      ln.setAttribute('x1', cx); ln.setAttribute('y1', cy);
      ln.setAttribute('x2', p[0]); ln.setAttribute('y2', p[1]);
      ln.setAttribute('stroke','rgba(240,237,232,.22)');
      ln.setAttribute('stroke-width','0.5');
      svg.appendChild(ln);
    });
  }
}

updateClipPaths();
window.addEventListener('resize', updateClipPaths);

(function(){
  const root  = document.documentElement;
  const intro = document.getElementById('intro');
  if (!intro) return;

  const INTRO = {
    SHOW:  1100,
    MOVE:  1200,
    LINES:  700,
    GAP:    150,
    SPLIT: 1100,
  };

  function finish() {
    intro.remove();
    root.classList.remove('intro-on');
    window.removeEventListener('resize', onResize);
  }
  if (!root.classList.contains('intro-on')) { intro.remove(); return; }
  const logo = document.getElementById('logo-img');
  const lockup = document.querySelector('.ba-lockup');
  if (!intro.animate || !logo || !lockup) { finish(); return; }

  const W = hero.clientWidth, H = hero.clientHeight;
  const hr = hero.getBoundingClientRect(), lr = logo.getBoundingClientRect();
  const cx = lr.left - hr.left + lr.width / 2, cy = lr.top - hr.top + lr.height / 2;
  const hexH = lr.height;
  const hexW = hexH * 596 / 687;
  const u = hexH / 200;
  const SVG = 'http://www.w3.org/2000/svg';

  function ray(deg) {
    const a = deg * Math.PI / 180, dx = Math.cos(a), dy = Math.sin(a), ts = [];
    if (dx >  1e-9) ts.push((W - cx) / dx);
    if (dx < -1e-9) ts.push(-cx / dx);
    if (dy >  1e-9) ts.push((H - cy) / dy);
    if (dy < -1e-9) ts.push(-cy / dy);
    const t = Math.min(...ts.filter(v => v > 1e-4));
    return [cx + dx * t, cy + dy * t];
  }
  const EASE = 'cubic-bezier(.65,0,.35,1)';

  const bg = document.createElement('div'); bg.className = 'intro-bg'; intro.appendChild(bg);
  const pTop = ray(-90), pL = ray(150), pR = ray(30);
  const poly = pts => 'polygon(' + pts.map(p => p[0].toFixed(1) + 'px ' + p[1].toFixed(1) + 'px').join(',') + ')';
  const D = Math.hypot(W, H);
  const pieces = [
    { pts:[[cx,cy], pTop, [0,0], [0,H], pL], dir:[-0.866,-0.5] },
    { pts:[[cx,cy], pR, [W,H], [W,0], pTop], dir:[ 0.866,-0.5] },
    { pts:[[cx,cy], pL, [0,H], [W,H], pR],   dir:[ 0,     1  ] },
  ].map(p => {
    const el = document.createElement('div');
    el.className = 'intro-piece';
    el.style.clipPath = el.style.webkitClipPath = poly(p.pts);
    intro.appendChild(el);
    return { el, dir:p.dir };
  });

  const lines = document.createElementNS(SVG, 'svg');
  lines.setAttribute('class', 'intro-lines');
  lines.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const lineEls = [[-90, pTop], [150, pL], [30, pR]].map(([deg, end]) => {
    const a = deg * Math.PI / 180;
    const x1 = cx + Math.cos(a) * hexH / 2, y1 = cy + Math.sin(a) * hexH / 2;
    const len = Math.max(0, Math.hypot(end[0] - x1, end[1] - y1));
    const ln = document.createElementNS(SVG, 'line');
    ln.setAttribute('x1', x1); ln.setAttribute('y1', y1);
    ln.setAttribute('x2', end[0]); ln.setAttribute('y2', end[1]);
    ln.setAttribute('stroke', 'rgba(240,237,232,.75)');
    ln.setAttribute('stroke-width', '1');
    ln.style.strokeDasharray = len;
    ln.style.strokeDashoffset = len;
    lines.appendChild(ln);
    return { ln, len };
  });
  intro.appendChild(lines);

  const mark = document.createElement('div');
  mark.className = 'intro-mark';
  mark.style.cssText = `left:${cx}px; top:${cy}px; width:${hexW}px; height:${hexH}px;`;
  const img = document.createElement('img');
  img.src = logo.getAttribute('src'); img.alt = '';
  const word = document.createElement('div');
  word.className = 'intro-word';
  const WORD_W = 1749 - 173.2;
  word.style.cssText = `top:${47 * u}px; height:${106 * u}px; width:${WORD_W * u}px;`;
  const text = lockup.cloneNode(true);
  text.querySelector('g').remove();
  text.removeAttribute('class'); text.removeAttribute('role'); text.removeAttribute('aria-label');
  text.setAttribute('viewBox', '249 47 1500 106');
  text.style.cssText = `left:${(249 - 173.2) * u}px; width:${1500 * u}px;`;
  word.appendChild(text);
  mark.appendChild(word);
  mark.appendChild(img);
  intro.appendChild(mark);
  intro.classList.add('is-built');

  const k  = Math.min(1, Math.min(W * 0.8, 820) / (1749 * u));
  const dx = (86.6 - 874.5) * u * k;
  const BASE = 'translate(-50%,-50%)';

  let t = 0;
  mark.animate([{ opacity:0 }, { opacity:1 }], { duration:600, easing:'ease-out' });
  mark.animate(
    [{ transform:`${BASE} translateX(${dx}px) scale(${k})` }, { transform:BASE }],
    { duration:INTRO.MOVE, delay:INTRO.SHOW, easing:EASE, fill:'backwards' });
  text.animate(
    [{ transform:'translateX(0)' }, { transform:`translateX(${-(WORD_W + 1) * u}px)` }],
    { duration:INTRO.MOVE, delay:INTRO.SHOW, easing:'cubic-bezier(.55,0,.45,1)', fill:'forwards' });

  t = INTRO.SHOW + INTRO.MOVE;
  lineEls.forEach(({ ln, len }) => ln.animate(
    [{ strokeDashoffset:len }, { strokeDashoffset:0 }],
    { duration:INTRO.LINES, delay:t, easing:'cubic-bezier(.2,.7,.2,1)', fill:'forwards' }));

  t += INTRO.LINES + INTRO.GAP;
  bg.animate([{ opacity:1 }, { opacity:0 }], { duration:1, delay:t, fill:'forwards' });
  pieces.forEach(({ el, dir }) => el.animate(
    [{ transform:'translate(0,0)' }, { transform:`translate(${dir[0] * D}px, ${dir[1] * D}px)` }],
    { duration:INTRO.SPLIT, delay:t, easing:'cubic-bezier(.7,0,.25,1)', fill:'forwards' }));

  lines.animate([{ opacity:1 }, { opacity:.3 }], { duration:INTRO.SPLIT, delay:t, fill:'forwards' });
  mark.animate([{ opacity:1 }, { opacity:0 }], { duration:INTRO.SPLIT, delay:t, easing:'ease-in', fill:'forwards' });

  setTimeout(finish, t + INTRO.SPLIT);

  function onResize() {
    if (hero.clientWidth !== W || Math.abs(hero.clientHeight - H) > 120) finish();
  }
  window.addEventListener('resize', onResize);
})();

(function(){
  const wrap = document.getElementById('vision-reveal-wrap');
  const curtain = document.getElementById('vision-curtain');
  if (!wrap || !curtain) return;

  const OPEN_VH = 70;

  let ticking = false;

  function apply() {
    ticking = false;
    const openPx  = OPEN_VH / 100 * window.innerHeight;
    const scrolled = -wrap.getBoundingClientRect().top;
    const t = Math.min(1, Math.max(0, scrolled / openPx));
    curtain.style.transform = 'scaleY(' + (1 - t) + ')';
  }

  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(apply);
  }

  apply();
  window.addEventListener('scroll', onScroll, { passive:true });
  window.addEventListener('resize', onScroll);
})();

function setActive(d) {
  if (d === curDom) return;
  curDom = d;
  Object.keys(doms).forEach(k => {
    const isActive = k === d;
    doms[k].classList.toggle('active', isActive);

    const vid = doms[k].querySelector('.domain-video');
    if (vid) {
      if (isActive) { vid.currentTime = 0; vid.play().catch(()=>{}); vid.classList.add('playing'); }
      else          { vid.pause(); vid.classList.remove('playing'); }
    }
  });
}

function clearActive() {
  curDom = null;
  Object.values(doms).forEach(el => {
    el.classList.remove('active');
    const vid = el.querySelector('.domain-video');
    if (vid) { vid.pause(); vid.classList.remove('playing'); }
  });
}

(function(){
  const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';

  function decode(el, opt, onDone){
    const orig = el.textContent.trim(), len = orig.length;
    const done = Array(len).fill(false); let f=0, revealed=0;
    const TOTAL_FRAMES = opt.frames, revealStart = opt.revealStart;

    const nsIdx=[]; for(let i=0;i<len;i++) if(orig[i]!==' ') nsIdx.push(i);
    const preCount=Math.floor(nsIdx.length/2);
    for(let i=0;i<preCount;i++) done[nsIdx[i]]=true;
    const remain=nsIdx.length-preCount;
    const perFrame = Math.max(1, remain/(TOTAL_FRAMES-revealStart));
    function tick(){
      let out='';
      for(let i=0;i<len;i++){ if(orig[i]===' '){out+=' ';continue;} if(done[i]){out+=orig[i];continue;} out+=CHARS[Math.floor(Math.random()*CHARS.length)]; }
      el.textContent=out;
      if(f>=revealStart){ let tr=Math.floor((f-revealStart+1)*perFrame)-revealed; for(let j=0;j<len&&tr>0;j++){if(!done[j]&&orig[j]!==' '){done[j]=true;revealed++;tr--;}} }
      f++;
      if(!done.every((d,i)=>d||orig[i]===' ')&&f<TOTAL_FRAMES+5) setTimeout(tick,opt.interval);
      else { el.textContent=orig; if(onDone) onDone(); }
    }
    if(opt.delay) setTimeout(tick, opt.delay); else tick();
  }

  const heroTitle = document.querySelector('#hero-copy .decode');
  if(heroTitle){ heroTitle.classList.add('visible'); decode(heroTitle, {frames:18, revealStart:4, interval:40, delay:600}); }

  const SEC = {frames:Math.floor(500/30), revealStart:Math.floor(Math.floor(500/30)*.25), interval:30};

  const secObs = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(!entry.isIntersecting) return;
      const el=entry.target;
      if(el.closest('#hero')) return;
      el.classList.add('visible');
      decode(el, SEC);
      secObs.unobserve(el);
    });
  },{threshold:.2});
  document.querySelectorAll('.decode:not(#hero-copy .decode)').forEach(el=>secObs.observe(el));
})();
